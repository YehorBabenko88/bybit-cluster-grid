name: Agent2 event-ordered lifecycle v3
on:
  pull_request:
    paths:
      - grid/coordination_event_v3.py
      - tests/coordination/test_event_ordered_v3.py
      - tests/coordination/event_v3/**
      - scripts/agent2-event-v3/**
      - docs/coordination/event-ordered-v3.md
      - .github/workflows/agent2-event-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_GRID_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact fixture dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/agent2-event-v3/requirements.lock
      - name: Exact-source offline MODEL tests
        shell: python
        run: |
          import os,subprocess,sys
          subprocess.run([sys.executable,'tests/coordination/event_v3/verify_offline.py','--expected',os.environ['EXPECTED_GRID_SHA'],'--output',os.path.join(os.environ['RUNNER_TEMP'],'event-v3-offline')],check=True)
      - name: No-replace controls in independent owned clone
        shell: python
        run: |
          import os,pathlib,shutil,subprocess,sys
          scratch=pathlib.Path(os.environ['RUNNER_TEMP'],'event-v3-noreplace')
          subprocess.run([sys.executable,'tests/coordination/event_v3/verify_no_replace.py','--expected',os.environ['EXPECTED_GRID_SHA'],'--scratch',str(scratch)],check=True)
          shutil.copyfile(scratch/'evidence.json',pathlib.Path(os.environ['RUNNER_TEMP'],'event-v3-offline/no-replace-evidence.json'))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: event-v3-model-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/event-v3-offline/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: event-v3-junit-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/event-v3-offline/tests.xml
          if-no-files-found: error
  real-three-voters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_GRID_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.eol
      GIT_CONFIG_VALUE_1: lf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/agent2-event-v3/requirements.lock
      - name: Source before real fixture
        shell: python
        run: |
          import json,os,pathlib,runpy
          evidence=runpy.run_path('lab/consul/source_receipt.py')['verify'](os.environ['EXPECTED_GRID_SHA'])
          pathlib.Path(os.environ['RUNNER_TEMP'],'event-v3-source-before.json').write_text(json.dumps(evidence,indent=2))
      - run: docker --host=unix:///var/run/docker.sock pull hashicorp/consul@sha256:259fd02f2544fe1aa03fa49efd3b105c8dd67106d710a72f5e898110266356f7
      - name: Real persistent processes and fault scenarios
        shell: python
        run: |
          import json,os,pathlib,subprocess,sys
          output=pathlib.Path(os.environ['RUNNER_TEMP'],'event-v3-three')
          subprocess.run([sys.executable,'scripts/agent2-event-v3/verify_three.py','--execute-ephemeral-hosted-linux','--output',str(output)],check=True)
          e=json.loads((output/'evidence.json').read_text())
          required={'image_source_checked','three_real_voters','grant_and_idempotent_receipt','raft_leader_crash_receipt_survives','successor_renews_old_leader_rejected','lease_invalidation_no_successor_rejected_terminal_reconciled','two_voter_loss_no_new_mutation','simultaneous_restart_durable_receipt','one_two_partition_majority_consistent_receipt','one_two_partition_majority_commits_reachable_minority_denied','partition_heal_reconciled'}
          assert e['result']=='PASS' and required<={x['scenario'] for x in e['events']}
          assert len(e['nodes'])==len({n['id'] for n in e['nodes']})==3
          assert not any(x['scenario'] in ('failure','cleanup_failure') for x in e['events'])
      - name: Final source receipt
        if: always()
        shell: python
        run: |
          import hashlib,json,os,pathlib,runpy
          e=runpy.run_path('lab/consul/source_receipt.py')['verify'](os.environ['EXPECTED_GRID_SHA'])
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'event-v3-three/evidence.json')
          e.update(evidence_sha256=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],production='NO_GO')
          pathlib.Path(os.environ['RUNNER_TEMP'],'event-v3-source-after.json').write_text(json.dumps(e,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: event-v3-real-three-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/event-v3-three/evidence.json
            ${{ runner.temp }}/event-v3-source-before.json
            ${{ runner.temp }}/event-v3-source-after.json
          if-no-files-found: error
