name: windows-python-native-containment
on:
  pull_request:
    paths: ['installer/native-python-containment/**', 'installer/native-g1-controller-fixture/**', 'integration/windows_python_probe.py', 'integration/python_containment_evidence.py', 'tools/python_containment_bundle.py', 'tests/test_python_containment_*.py', '.github/workflows/windows-python-containment.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python-containment:
    if: ${{ (github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021') && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        python: ['3.11', '3.12']
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r integration/requirements-first-boot.txt
      - name: Build measured CPython/dependencies/source closure; never execute here
        run: |
          $ErrorActionPreference='Stop'
          if((& git rev-parse HEAD) -ne $env:EXACT_HEAD_SHA){throw 'CHECKOUT_HEAD_MISMATCH'}
          python -m tools.python_containment_bundle
          if($LASTEXITCODE -ne 0){throw 'PYTHON_INPUT_FAILED'}
          New-Item -ItemType Directory python-containment-evidence | Out-Null
          Copy-Item -LiteralPath python-input/manifest.json -Destination python-containment-evidence/input.json
          python -m pip freeze > python-containment-evidence/dependencies.txt
      - name: Compile native boundary with warnings as errors
        run: dotnet build installer/native-python-containment/NativePythonContainment.csproj -c Release --nologo
      - name: Real CPython and Grid negative lifecycle in own AppContainer only
        run: |
          $ErrorActionPreference='Stop'
          $rows=@(& ./installer/native-python-containment/bin/Release/net8.0-windows/NativePythonContainment.exe --hosted-python-tests)
          $result=$LASTEXITCODE
          if($rows.Count -eq 1){[IO.File]::WriteAllText((Join-Path $PWD 'python-containment-evidence/native.json'),($rows -join "`n"),[Text.UTF8Encoding]::new($false))}
          if($rows.Count -ne 1 -or $result -ne 0){$rows|Write-Output;throw 'PYTHON_BOUNDARY_FAILED'}
          python -m integration.python_containment_evidence create python-containment-evidence $env:EXACT_HEAD_SHA $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT
          if($LASTEXITCODE -ne 0){throw 'PYTHON_BOUNDARY_RECEIPT_FAILED'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-boundary-${{ matrix.shell }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: python-containment-evidence/
          if-no-files-found: error
  required-python-containment:
    if: ${{ always() && !cancelled() && (github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021') && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    needs: [python-containment]
    runs-on: ubuntu-latest
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - env:
          RESULT: ${{ needs.python-containment.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: python-boundary-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded-python-boundary
      - name: Reinspect all four complete original receipts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from integration.python_containment_evidence import receipt
          folders=list(Path('downloaded-python-boundary').glob('*'))
          if len(folders)!=4:raise RuntimeError('MISSING_PYTHON_MATRIX_ARTIFACT')
          for folder in folders:
              result=receipt(folder,os.environ['EXACT_HEAD_SHA'],os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'])
              if result['tests']!=16:raise RuntimeError('PYTHON_BOUNDARY_CASES_MISSING')
          PY
