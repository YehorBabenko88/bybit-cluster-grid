name: GPT B qualified provenance read contract (inert)
on:
  pull_request:
  push:
    branches: ['gpt/b-qualified-provenance-read-v1-20261126']
permissions:
  contents: read
jobs:
  read-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: 9e6acbd9e12a91189f57234828e31640983af553
          path: .source/math
          persist-credentials: false
      - name: Checkout exact D134 Terminan consumer and managed Grid regression
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/Terminan
          ref: 3608e41b90b2dbf7a80d7daa86582a2440e11330
          path: .source/terminan
          persist-credentials: false
      - name: Checkout G-owned Strattester managed Grid reader migration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/strattester
          ref: c95ced815575ab3fe25f619f97e9bf040d58f3da
          path: .source/strattester
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm immutable Grid Math and D134 checkouts
        shell: python
        env:
          GRID_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import os, pathlib, subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['GRID_TEST_SHA']
          root=pathlib.Path('.source/math')
          assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip() == '9e6acbd9e12a91189f57234828e31640983af553'
          assert subprocess.check_output(['git','-C','.source/terminan','rev-parse','HEAD'],text=True).strip() == '3608e41b90b2dbf7a80d7daa86582a2440e11330'
          assert subprocess.check_output(['git','-C','.source/strattester','rev-parse','HEAD'],text=True).strip() == 'c95ced815575ab3fe25f619f97e9bf040d58f3da'
      - name: Install exact Math and pytest without credentials
        run: |
          python -m pip install --no-deps ./.source/math
          python -m pip install pytest==8.3.5 jsonschema==4.23.0 requests==2.32.5
      - name: Build additive v2 SDK wheel without touching legacy runtime49
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install additive SDK wheel and prove isolated import
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels=list(pathlib.Path('dist').glob('market_data-*.whl'))
          assert len(wheels) == 1, 'exactly one canonical SDK wheel'
          subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',str(wheels[0])])
          subprocess.check_call([sys.executable,'-I','-c',
            'import importlib.metadata as meta; import market_data, market_data_v2.qualified_read_contract, market_data_v2.qualified_rollup, market_data_v2.read_api; assert meta.version("market-data") == "0.2.0.dev0"; assert market_data_v2.read_api.ROUTE == "/internal/v2/candles/qualified"; assert market_data_v2.read_api.ROLLUP_ROUTE == "/internal/v2/candles/qualified-rollup"'])
      - name: Execute qualified provenance and authenticated route regression suite
        run: python -m pytest -v --strict-markers -p no:cacheprovider tests/market_data/test_qualified_read_contract.py tests/market_data/test_qualified_route_v2.py tests/market_data/test_qualified_read_schema_v2.py tests/market_data/test_v2_wheel_guard.py tests/market_data/test_c_lab_fenced_writer.py tests/market_data/test_qualified_rollup_round27.py tests/market_data/test_historical_asof_round28.py tests/market_data/test_lossless_mtf_round30.py

      - name: Execute original D134 managed Grid to Terminan HTTP roundtrip (inert)
        working-directory: .source/terminan
        env:
          ROUND3_GRID_SOURCE: ${{ github.workspace }}
          ROUND3_MATH_SOURCE: ${{ github.workspace }}/.source/math/python
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s integration -p test_b_v2_roundtrip.py -v
      - name: Execute G123 original disposable Strattester managed-reader regression
        working-directory: .source/strattester
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -v --strict-markers -p no:cacheprovider tests/marketdata/test_download_smoke_g32.py
