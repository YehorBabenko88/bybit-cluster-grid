name: GPT B qualified provenance read contract (inert)
on:
  pull_request:
  push:
    branches: ['gpt/b-qualified-provenance-read-v1-20261126']
permissions:
  contents: read
jobs:
  read-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: 9e6acbd9e12a91189f57234828e31640983af553
          path: .source/math
          persist-credentials: false
      - name: Checkout original historical D129 68-line implementation (test only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/Terminan
          ref: 6e4a39c185d51eeab37f004964655da3b8dd938b
          path: .source/terminan-d129
          persist-credentials: false
      - name: Checkout original historical D167 Math kernel (test only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: 14d9ca92803b3ede19c7292e85c3627554d5c1d9
          path: .source/math-d167
          persist-credentials: false
      - name: Checkout original B311 epoch modules (H source tests only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/bybit-cluster-grid
          ref: eee29d8fae7c52d5b489a86a5a9ec08718265f18
          path: .source/grid-b311
          persist-credentials: false
      - name: Checkout D136 original qualified Terminan consumer (test only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/Terminan
          ref: fe4316d7c1580b9799903b57d8471034b5281996
          path: .source/terminan-d136
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm immutable historical G012 source, its Math and canonical Math
        shell: python
        run: |
          import pathlib, subprocess
          pins = {
            '.source/math': '9e6acbd9e12a91189f57234828e31640983af553',
            '.source/terminan-d129': '6e4a39c185d51eeab37f004964655da3b8dd938b',
            '.source/math-d167': '14d9ca92803b3ede19c7292e85c3627554d5c1d9',
            '.source/grid-b311': 'eee29d8fae7c52d5b489a86a5a9ec08718265f18',
            '.source/terminan-d136': 'fe4316d7c1580b9799903b57d8471034b5281996',
          }
          for where, sha in pins.items():
            root = pathlib.Path(where)
            actual = subprocess.check_output(
              ['git', '-C', str(root), 'rev-parse', 'HEAD'],
              text=True).strip()
            assert actual == sha, (where, actual, sha)
      - name: Install exact Math and pytest without credentials
        run: |
          python -m pip install --no-deps ./.source/math
          python -m pip install pytest==8.3.5 jsonschema==4.23.0
      - name: Build additive v2 SDK wheel without touching legacy runtime49
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install additive SDK wheel and prove isolated import
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels=list(pathlib.Path('dist').glob('market_data-*.whl'))
          assert len(wheels) == 1, 'exactly one canonical SDK wheel'
          subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',str(wheels[0])])
          subprocess.check_call([sys.executable,'-I','-c',
            'import importlib.metadata as meta; import market_data, market_data_v2.qualified_read_contract, market_data_v2.qualified_rollup, market_data_v2.read_api; assert meta.version("market-data") == "0.2.0.dev0"; assert market_data_v2.read_api.ROUTE == "/internal/v2/candles/qualified"; assert market_data_v2.read_api.ROLLUP_ROUTE == "/internal/v2/candles/qualified-rollup"'])
      - name: Execute qualified provenance and authenticated route regression suite
        run: python -m pytest -v --strict-markers -p no:cacheprovider tests/market_data/test_qualified_read_contract.py tests/market_data/test_qualified_route_v2.py tests/market_data/test_qualified_read_schema_v2.py tests/market_data/test_v2_wheel_guard.py tests/market_data/test_c_lab_fenced_writer.py tests/market_data/test_qualified_rollup_round27.py tests/market_data/test_historical_asof_round28.py tests/market_data/test_lossless_mtf_round30.py tests/market_data/test_h_round28_mtf_parity.py tests/market_data/test_h_round29_asof_contract.py tests/market_data/test_h_round30_lossless_original.py tests/market_data/test_h_round32_cursor_contract.py tests/market_data/test_h_round34_g012_original_differential.py tests/market_data/test_h_round35_b311_epoch_independent.py tests/market_data/test_h_round35_d136_original_consumer.py
