name: vm-principal-offline-model

on:
  pull_request:
    paths:
      - 'vm_principal_lab/**'
      - 'tests/test_vm_principal_*.py'
      - '.github/workflows/vm-principal-offline-model.yml'
  push:
    paths:
      - 'vm_principal_lab/**'
      - 'tests/test_vm_principal_*.py'
      - '.github/workflows/vm-principal-offline-model.yml'

permissions:
  contents: read

jobs:
  offline-principal-contract:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' }}
    name: offline principal contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run isolated offline model tests
        run: python -m pytest -q tests/test_vm_principal_offline.py tests/test_vm_principal_negative_cases.py tests/test_vm_principal_evidence_consistency.py tests/test_vm_principal_readiness_audit.py tests/test_vm_principal_evidence_completeness.py tests/test_vm_principal_cross_guest_isolation.py tests/test_vm_principal_evidence_binding.py
