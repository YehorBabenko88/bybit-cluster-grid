name: windows-bundle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "grid/**"
      - "installer/**"
      - "strategies/**"
      - "run_worker.py"
      - "run_coordinator.py"
      - "requirements.txt"
      - "requirements-ml.txt"
      - ".github/workflows/windows-bundle.yml"

permissions:
  contents: read

concurrency:
  group: windows-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep the Windows artifact gate tied to the same release HEAD as preflight.

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build isolated Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $bundle=Join-Path $env:RUNNER_TEMP "BybitClusterGrid"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item grid,installer,strategies -Destination $bundle -Recurse
          Copy-Item run_worker.py,run_coordinator.py,requirements.txt,requirements-ml.txt -Destination $bundle
          $py=(Get-Command python).Source
          $pyRoot=Split-Path $py -Parent
          $runtime=Join-Path $bundle "runtime"
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item (Join-Path $pyRoot "*") $runtime -Recurse -Force
          & (Join-Path $runtime "python.exe") -m pip install --disable-pip-version-check -r (Join-Path $bundle "requirements.txt")

      - name: Optionally include pinned PostgreSQL installer
        shell: pwsh
        env:
          PG_URL: ${{ vars.GRID_POSTGRES_INSTALLER_URL }}
          PG_SHA256: ${{ vars.GRID_POSTGRES_INSTALLER_SHA256 }}
        run: |
          $ErrorActionPreference="Stop"
          if(!$env:PG_URL -and !$env:PG_SHA256){
            Write-Host "No bundled PostgreSQL requested; artifact supports externally provisioned CONTROL PostgreSQL."
            exit 0
          }
          if(!$env:PG_URL -or !$env:PG_SHA256){ throw "Set both GRID_POSTGRES_INSTALLER_URL and GRID_POSTGRES_INSTALLER_SHA256, or neither." }
          $bundle=Join-Path $env:RUNNER_TEMP "BybitClusterGrid"
          $dst=Join-Path $bundle "postgres-installer.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $env:PG_URL -OutFile $dst
          $actual=(Get-FileHash $dst -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $env:PG_SHA256.ToLowerInvariant()){ throw "PostgreSQL installer SHA256 mismatch" }

      - name: Parse all PowerShell installer scripts
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          Get-ChildItem installer -Filter *.ps1 -File | ForEach-Object {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              $msg=($errors | ForEach-Object {$_.Message}) -join "; "
              throw ("PowerShell parse failed for "+$_.Name+": "+$msg)
            }
          }

      - name: Parse service launchers
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          foreach($file in @('installer/launcher.ps1','installer/coordinator-launcher.ps1','installer/recover-release.ps1')){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ throw ("PowerShell parse failed for "+$file+": "+(($errors | ForEach-Object {$_.Message}) -join '; ')) }
          }

      - name: Test guarded release switch
        shell: pwsh
        run: |
          & ./tests/test_release_switch.ps1

      - name: Test interrupted release recovery
        shell: pwsh
        run: |
          & ./tests/test_release_recovery.ps1

      - name: Windows suspended ML process containment integration
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest psutil pydantic-settings
          python -m pytest -q tests/test_ml_process_supervisor.py -k "windows_suspended_job or windows_job_close or windows_parent_crash or windows_descendant_inherits_pipes"
          python -m pytest -q tests/test_ml_runtime_readiness.py

      - name: Validate isolated ML venv on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $bundle=Join-Path $env:RUNNER_TEMP "BybitClusterGrid"
          $root=Join-Path $env:RUNNER_TEMP "grid-ml-isolation-test"
          $base=(Get-Command python).Source
          & ./installer/bootstrap-ml.ps1 -Python $base -BasePython $base -ReleaseDir $bundle -RuntimeRoot $root -Mode PILOT
          if($LASTEXITCODE -ne 0){ throw "ML bootstrap failed" }
          $mlpy=Join-Path $root "ml-venv\Scripts\python.exe"
          if(!(Test-Path $mlpy)){ throw "Isolated ML interpreter missing" }
          & $mlpy -c "import numpy,scipy,sklearn,joblib,xgboost,lightgbm; print('isolated ML ready')"
          if($LASTEXITCODE -ne 0){ throw "ML interpreter imports failed" }
          & $base -c "import sys; print(sys.executable)"
          & $mlpy -c "import sys; print(sys.executable)"
          & ./installer/bootstrap-ml.ps1 -Python $base -BasePython $base -ReleaseDir $bundle -RuntimeRoot $root -Mode PILOT
          if($LASTEXITCODE -ne 0){ throw "Idempotent ML bootstrap failed" }
          # Simulate a truncated/partially installed virtual environment.
          Remove-Item -LiteralPath $mlpy -Force
          & ./installer/bootstrap-ml.ps1 -Python $base -BasePython $base -ReleaseDir $bundle -RuntimeRoot $root -Mode PILOT
          if($LASTEXITCODE -ne 0){ throw "Corrupted ML venv repair failed" }
          if(!(Test-Path $mlpy)){ throw "ML interpreter not restored" }
          & $mlpy -c "import numpy,xgboost,lightgbm,asyncpg,psutil"
          if($LASTEXITCODE -ne 0){ throw "Repaired ML venv cannot import dependencies" }
          $journal=Get-Content (Join-Path $root "ml-bootstrap.json") -Raw | ConvertFrom-Json
          if($journal.status -ne "ready"){ throw "Repaired ML environment not ready" }
          # Ensure the host Python was not replaced by the ML interpreter.
          & $base -c "import sys; assert 'ml-venv' not in sys.executable.lower()"
          if($LASTEXITCODE -ne 0){ throw "Base interpreter was modified" }

      - name: Reject concurrent ML bootstrap without changing ready journal
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $bundle=Join-Path $env:RUNNER_TEMP "BybitClusterGrid"
          $root=Join-Path $env:RUNNER_TEMP "grid-ml-isolation-test"
          $base=(Get-Command python).Source
          $journalPath=Join-Path $root "ml-bootstrap.json"
          $before=Get-Content -LiteralPath $journalPath -Raw
          $lockPath=Join-Path $root "ml-bootstrap.lock"
          $handle=[System.IO.File]::Open($lockPath,[System.IO.FileMode]::OpenOrCreate,
            [System.IO.FileAccess]::ReadWrite,[System.IO.FileShare]::None)
          try {
            $output=& ./installer/bootstrap-ml.ps1 -Python $base -BasePython $base -ReleaseDir $bundle -RuntimeRoot $root -Mode PILOT 2>&1
            if($LASTEXITCODE -eq 0){ throw "Concurrent ML bootstrap unexpectedly succeeded" }
            $after=Get-Content -LiteralPath $journalPath -Raw
            if($after -ne $before){ throw "Concurrent ML bootstrap modified the ready journal" }
          } finally {
            $handle.Dispose()
          }
          & ./installer/bootstrap-ml.ps1 -Python $base -BasePython $base -ReleaseDir $bundle -RuntimeRoot $root -Mode PILOT
          if($LASTEXITCODE -ne 0){ throw "ML bootstrap did not recover after lock release" }

      - name: Test supervisor crash recovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_release_supervisor_lifecycle.py -v

      - name: Assert host hardening is bundled
        shell: pwsh
        run: |
          $bundle=Join-Path $env:RUNNER_TEMP "BybitClusterGrid"
          if(!(Test-Path (Join-Path $bundle "installer\\harden-host.ps1"))){ throw "harden-host.ps1 missing from Windows bundle" }
          if(!(Test-Path (Join-Path $bundle "requirements-ml.txt"))){ throw "requirements-ml.txt missing from Windows bundle" }

      - name: CONTROL preflight on finished bundle
        shell: pwsh
        env:
          GRID_SHARED_TOKEN: test-token
          POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:55432/grid
        run: |
          $bundle=Join-Path $env:RUNNER_TEMP "BybitClusterGrid"
          & (Join-Path $bundle "installer\preflight.ps1") -ReleaseDir $bundle -Python (Join-Path $bundle "runtime\python.exe") -Mode CONTROL

      - name: Build SHA256 manifests and zip
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $bundle=Join-Path $env:RUNNER_TEMP "BybitClusterGrid"

          # Installer/bundle manifest.
          $bundleManifest=@()
          Get-ChildItem $bundle -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $rel=$_.FullName.Substring($bundle.Length+1).Replace("\","/")
              $bundleManifest += [ordered]@{
                path=$rel
                sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                size=$_.Length
              }
            }

          [ordered]@{
            schema=1
            commit="${{ github.sha }}"
            files=$bundleManifest
          } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Encoding UTF8 (Join-Path $bundle "bundle-manifest.json")

          # Runtime integrity manifest consumed by grid.integrity_guard.
          # Manifest files themselves are excluded to avoid self-referential hashes.
          $releaseFiles=[ordered]@{}

          Get-ChildItem $bundle -File -Recurse |
            Where-Object {
              $rel=$_.FullName.Substring($bundle.Length+1).Replace("\\","/")
              $_.Name -ne "release-manifest.json" -and
              $_.Name -ne "bundle-manifest.json" -and
              $_.Extension -notin @(".pyc",".pyo") -and
              $rel -notmatch "(^|/)__pycache__(/|$)"
            } |
            Sort-Object FullName |
            ForEach-Object {
              $rel=$_.FullName.Substring($bundle.Length+1).Replace("\","/")
              $releaseFiles[$rel]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }

          $releaseManifest=[ordered]@{
            version="${{ github.sha }}"
            files=$releaseFiles
          } | ConvertTo-Json -Depth 10

          $releaseManifestPath=Join-Path $bundle "release-manifest.json"
          [System.IO.File]::WriteAllText(
            $releaseManifestPath,
            $releaseManifest,
            [System.Text.UTF8Encoding]::new($false)
          )

          $zip=Join-Path $env:RUNNER_TEMP "BybitClusterGrid-${{ github.sha }}.zip"

          Compress-Archive `
            -Path (Join-Path $bundle "*") `
            -DestinationPath $zip

          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content (Join-Path $env:RUNNER_TEMP "BybitClusterGrid-${{ github.sha }}.zip.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BybitClusterGrid-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/BybitClusterGrid-${{ github.sha }}.zip
            ${{ runner.temp }}/BybitClusterGrid-${{ github.sha }}.zip.sha256
          retention-days: 7
