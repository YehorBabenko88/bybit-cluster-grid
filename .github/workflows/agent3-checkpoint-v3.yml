name: Agent3 checkpoint V3 codec
on:
  pull_request:
    paths:
      - 'grid/checkpoint_v3_codec.py'
      - 'tests/test_market_data_lifecycle_checkpoint_v3.py'
      - 'tests/fixtures/agent3-checkpoint-v3/**'
      - 'docs/market-data/agent3/**'
      - '.github/workflows/agent3-checkpoint-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-codec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Keep raw checkout bytes stable on disposable runner
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Source guard before tests
        shell: python {0}
        env:
          A3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          A3_GUARD_PHASE: before
        run: |
          import hashlib,json,os,stat,subprocess
          from pathlib import Path
          head=os.environ["A3_EXPECTED_HEAD"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==head
          owned=["grid/checkpoint_v3_codec.py","tests/test_market_data_lifecycle_checkpoint_v3.py","docs/market-data/agent3/checkpoint-v3.md",".github/workflows/agent3-checkpoint-v3.yml"]
          fixtures=subprocess.check_output(["git","ls-tree","-r","--name-only",head,"--","tests/fixtures/agent3-checkpoint-v3"],text=True).splitlines()
          paths=sorted(set(owned+fixtures+["grid/__init__.py","grid/observer_checkpoint.py"]))
          rows=[]
          for name in paths:
              path=Path(name)
              assert not path.is_absolute() and ".." not in path.parts
              current=Path.cwd()
              for part in path.parts:
                  current=current/part; info=current.lstat()
                  assert not stat.S_ISLNK(info.st_mode) and not (getattr(info,"st_file_attributes",0)&1024)
              assert path.is_file()
              mode=subprocess.check_output(["git","ls-tree",head,"--",name],text=True).split()[0]
              assert mode in {"100644","100755"}
              expected=subprocess.check_output(["git","cat-file","blob",head+":"+name])
              actual=path.read_bytes()
              assert actual==expected, "Raw tracked-source mismatch: "+name
              rows.append({"path":name,"sha256":hashlib.sha256(actual).hexdigest(),"bytes":len(actual)})
          out=Path(os.environ["RUNNER_TEMP"])/"agent3-checkpoint-v3"; out.mkdir(exist_ok=True)
          (out/(os.environ["A3_GUARD_PHASE"]+"-source.json")).write_text(json.dumps({"head":head,"phase":os.environ["A3_GUARD_PHASE"],"files":rows},indent=2),encoding="utf-8")
          print("Exact Git-blob/raw-file source guard:",len(rows),"files",os.environ["A3_GUARD_PHASE"])
      - name: Exact codec inventory and zero skips
        shell: python {0}
        env:
          A3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json,os,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          head=os.environ["A3_EXPECTED_HEAD"]
          raw=subprocess.check_output(["git","cat-file","blob",head+":tests/fixtures/agent3-checkpoint-v3/test-inventory.json"])
          inventory=json.loads(raw)
          out=Path(os.environ["RUNNER_TEMP"])/"agent3-checkpoint-v3"; out.mkdir(exist_ok=True)
          command=[sys.executable,"-B","-m","pytest","-q","-p","no:cacheprovider","--basetemp="+str(out/"pytest-temp"),"--junitxml="+str(out/"junit.xml"),"tests/test_market_data_lifecycle_checkpoint_v3.py"]
          result=subprocess.run(command,capture_output=True,text=True)
          (out/"pytest.log").write_text(result.stdout+result.stderr,encoding="utf-8"); print(result.stdout); print(result.stderr)
          assert result.returncode==0
          cases=ET.parse(out/"junit.xml").getroot().findall(".//testcase")
          assert len(cases)==inventory["expected_count"] and inventory["expected_skips"]==0
          assert not any(list(case) for case in cases)
          assert all(case.attrib["classname"]=="tests.test_market_data_lifecycle_checkpoint_v3" for case in cases)
          actual=sorted("tests/test_market_data_lifecycle_checkpoint_v3.py::"+case.attrib["name"] for case in cases)
          assert actual==sorted(inventory["nodeids"])
          (out/"result.json").write_text(json.dumps({"head":head,"evidence_scope":"PURE_CODEC_UNTRUSTED_CLAIMS_NOT_ACTUAL_AUTHORITY","cases":len(cases),"skips":0,"nodeids":actual},indent=2),encoding="utf-8")
      - name: Source guard after tests
        if: always()
        shell: python {0}
        env:
          A3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          A3_GUARD_PHASE: after
        run: |
          import hashlib,json,os,stat,subprocess
          from pathlib import Path
          head=os.environ["A3_EXPECTED_HEAD"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==head
          owned=["grid/checkpoint_v3_codec.py","tests/test_market_data_lifecycle_checkpoint_v3.py","docs/market-data/agent3/checkpoint-v3.md",".github/workflows/agent3-checkpoint-v3.yml"]
          fixtures=subprocess.check_output(["git","ls-tree","-r","--name-only",head,"--","tests/fixtures/agent3-checkpoint-v3"],text=True).splitlines()
          paths=sorted(set(owned+fixtures+["grid/__init__.py","grid/observer_checkpoint.py"]))
          rows=[]
          for name in paths:
              path=Path(name)
              assert not path.is_absolute() and ".." not in path.parts
              current=Path.cwd()
              for part in path.parts:
                  current=current/part; info=current.lstat()
                  assert not stat.S_ISLNK(info.st_mode) and not (getattr(info,"st_file_attributes",0)&1024)
              assert path.is_file()
              mode=subprocess.check_output(["git","ls-tree",head,"--",name],text=True).split()[0]
              assert mode in {"100644","100755"}
              expected=subprocess.check_output(["git","cat-file","blob",head+":"+name])
              actual=path.read_bytes()
              assert actual==expected, "Raw tracked-source mismatch: "+name
              rows.append({"path":name,"sha256":hashlib.sha256(actual).hexdigest(),"bytes":len(actual)})
          out=Path(os.environ["RUNNER_TEMP"])/"agent3-checkpoint-v3"; out.mkdir(exist_ok=True)
          (out/(os.environ["A3_GUARD_PHASE"]+"-source.json")).write_text(json.dumps({"head":head,"phase":os.environ["A3_GUARD_PHASE"],"files":rows},indent=2),encoding="utf-8")
          print("Exact Git-blob/raw-file source guard:",len(rows),"files",os.environ["A3_GUARD_PHASE"])
      - name: Upload offline codec evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-v3-${{ runner.os }}-py312
          path: ${{ runner.temp }}/agent3-checkpoint-v3/
          if-no-files-found: error
