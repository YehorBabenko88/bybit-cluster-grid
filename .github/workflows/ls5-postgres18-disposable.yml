name: ls5-postgres18-disposable
on:
  pull_request:
    paths:
      - 'tests/test_ls5_pg18_disposable.py'
      - 'tests/test_ls5_pg18_restore.py'
      - 'tests/test_ls5_pg18_static_guards.py'
      - '.github/workflows/ls5-postgres18-disposable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg18-lab:
    if: github.head_ref == 'parallel/ls5-postgres-readiness-20261024' || github.ref_name == 'parallel/ls5-postgres-readiness-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: grid_ci_disposable
          POSTGRES_USER: grid_ci
          POSTGRES_PASSWORD: ci_only_disposable
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U grid_ci -d grid_ci_disposable"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GRID_DISPOSABLE_PG18: 'YES'
      GRID_DISPOSABLE_PG_DSN: postgresql://grid_ci:ci_only_disposable@127.0.0.1:55439/grid_ci_disposable
      PYTHONDONTWRITEBYTECODE: '1'
      PGHOST: 127.0.0.1
      PGPORT: '55439'
      PGUSER: grid_ci
      PGDATABASE: grid_ci_disposable
      PGPASSWORD: ci_only_disposable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact HEAD
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Offline PostgreSQL guard regression
        run: python -m unittest discover -s tests -p test_ls5_pg18_static_guards.py -v
      - run: python -m pip install 'psycopg[binary]==3.2.10' 'pytest==8.3.5'
      - name: PostgreSQL 18 disposable transaction and restore tests
        run: python -m pytest -q tests/test_ls5_pg18_disposable.py tests/test_ls5_pg18_restore.py --junitxml=pg18-junit.xml
      - name: Verify test inventory and publish SHA256 receipt
        if: always()
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, xml.etree.ElementTree as ET
          path=pathlib.Path("pg18-junit.xml")
          if not path.is_file():
              raise SystemExit("MISSING_JUNIT")
          root=ET.parse(path).getroot()
          cases=list(root.iter("testcase"))
          names=[x.get("name") for x in cases]
          expected={"test_rollback_and_idempotent_replay","test_transaction_advisory_lock_contention","test_disconnect_rolls_back_uncommitted_write","test_unique_key_survives_reconnect","test_savepoint_recovery","test_wal_durability_configuration","test_backup_and_restore"}
          ok=len(cases)==len(expected) and set(names)==expected and not any(list(x) for x in cases)
          receipt={"schema":"ls5-pg18-ci-1","head":os.environ["EXACT_HEAD"],"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"testcases":names,"passed":ok,"physical_verified":False,"deployment_authorized":False}
          pathlib.Path("pg18-receipt.json").write_text(json.dumps(receipt,sort_keys=True),encoding="utf-8")
          if not ok:
              raise SystemExit("INCOMPLETE_OR_FAILED_JUNIT")
          PY
      - name: Upload independent review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pg18-disposable-evidence
          path: |
            pg18-junit.xml
            pg18-receipt.json
          if-no-files-found: error
