name: Grid B strict cross-repository 902 obligations (candidate)
on:
  pull_request:
  push:
    branches: ['gpt/**']
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '315532800'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  strict-partition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/strattester
          ref: 3850995a6c28ed29b05cef4ba067e587d5033453
          path: .source/strattester
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: 9e6acbd9e12a91189f57234828e31640983af553
          path: .source/math
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify immutable inputs and nine negative partitions
        shell: python
        run: |
          import pathlib, runpy, subprocess
          root = pathlib.Path.cwd()
          source = root / '.source/strattester'
          math = root / '.source/math'
          assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip() == '3850995a6c28ed29b05cef4ba067e587d5033453'
          assert subprocess.check_output(['git','-C',str(math),'rev-parse','HEAD'],text=True).strip() == '9e6acbd9e12a91189f57234828e31640983af553'
          subprocess.run(['python',str(root/'scripts/check_cross_repo_roster_partition.py')],check=True)
          materialize = runpy.run_path(str(root/'scripts/materialize_ci_sources.py'))['materialize']
          materialize(root, subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), ['market_data'])
          materialize(source,'3850995a6c28ed29b05cef4ba067e587d5033453',['market_data'])
          materialize(math,'9e6acbd9e12a91189f57234828e31640983af553',['python'])
      - name: Install only qualified Math and Grid public source
        run: |
          python -m pip install --no-deps ./.source/math
          python -m pip install ".[test]"
      - name: Strict 884 Grid execution — every setup/call/teardown must pass
        run: python scripts/run_cross_repo_roster.py --scope grid --evidence grid-884.json
      - name: Strict 18 Strattester historical custody — sealed source checkout
        run: python scripts/run_cross_repo_roster.py --scope custody --source-root .source/strattester --evidence custody-18.json
      - name: Retain both execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grid-strict-partition-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            grid-884.json
            custody-18.json
          if-no-files-found: warn
