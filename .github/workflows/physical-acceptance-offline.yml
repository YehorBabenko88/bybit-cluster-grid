name: physical-acceptance-offline
on:
  push:
    branches:
      - parallel/physical-acceptance-coordination-20261021
  pull_request:
    paths:
      - 'installer/physical_acceptance.py'
      - 'tests/test_physical_acceptance.py'
      - 'docs/PHYSICAL_COMMISSIONING_ACCEPTANCE.md'
      - '.github/workflows/physical-acceptance-offline.yml'
permissions:
  contents: read
jobs:
  negative-metadata:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact source HEAD
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib-only negative acceptance tests
        run: python -m unittest -v tests.test_physical_acceptance
