name: Agent2 unqualified worker DATA contract
on:
  push:
    branches: [feature/agent2-unqualified-worker-contract-20261109]
  pull_request:
    paths:
      - docs/coordination/assignment-v1/unqualified-worker-registration-v1/**
      - tests/coordination/assignment_v1/unqualified_registration/**
      - .github/workflows/agent2-unqualified-worker-contract.yml
permissions:
  contents: read
jobs:
  pure-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: windows
          - os: ubuntu-24.04
            lock: linux
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          path: grid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/unified-system
          ref: 1f6b0b5c231853607f5bec780f1544cd32bf577d
          path: support
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - shell: bash
        run: python -m pip install --only-binary=:all: --require-hashes -r support/docs/intelligence/research-identity/requirements-${{ matrix.lock }}.lock
      - shell: bash
        run: |
          set -o pipefail
          python -I -B grid/docs/coordination/assignment-v1/unqualified-worker-registration-v1/run_qualification.py --expected-head "$EXPECTED_HEAD" --support-root "$GITHUB_WORKSPACE/support" 2>&1 | tee "$RUNNER_TEMP/unqualified-contract.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unqualified-contract-${{ matrix.lock }}-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/unqualified-contract.log
          if-no-files-found: warn
