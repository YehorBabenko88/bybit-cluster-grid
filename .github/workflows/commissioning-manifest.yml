name: commissioning-manifest

on:
  push:
    branches: [audit/migration48-ci-20261014, audit/codex-schema48-recovery-plan]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate fail-closed commissioning manifest rules
        run: python -m unittest discover -s tests -p test_commissioning_manifest.py -v
