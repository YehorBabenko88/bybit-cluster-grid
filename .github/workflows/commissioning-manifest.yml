name: commissioning-manifest

on:
  push:
    branches: [audit/migration48-ci-20261014, audit/codex-schema48-recovery-plan, audit/integration-issue185-wal-20261015]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-validator:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate fail-closed commissioning manifest rules
        run: python -m unittest discover -s tests -p test_commissioning_manifest.py -v
