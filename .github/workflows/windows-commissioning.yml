name: windows-commissioning
on:
  push:
    branches: [audit/migration48-ci-20261014, audit/codex-schema48-recovery-plan, audit/integration-issue185-wal-20261015]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-script-fixtures:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test-only preflight configuration reader
        run: python -m pip install "python-dotenv>=1.0"
      - name: Plan, ownership, idempotence and rollback fixtures in PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files = @(Get-ChildItem installer -Recurse -Filter '*.ps1') + @(Get-ChildItem tests -Filter '*.ps1')
          foreach($file in $files){
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count){throw "PowerShell syntax errors: $($file.Name)"}
          }
          & ./installer/tests/test-safe-postgres-config.ps1
          & ./installer/tests/test-install-plan.ps1
          & ./installer/tests/test-release-runtime-guard.ps1
          & ./tests/test_release_switch.ps1
          & ./tests/test_release_recovery.ps1
          & ./installer/tests/test-rollback-plan.ps1
          & ./installer/tests/test-built-bundle-contract.ps1
          & ./installer/tests/test-legacy-rollback.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-release-repair-plan.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-audit-stage.ps1
          & ./installer/tests/test-install-apply.ps1
      - name: Plan, ownership, idempotence and rollback fixtures in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files = @(Get-ChildItem installer -Recurse -Filter '*.ps1') + @(Get-ChildItem tests -Filter '*.ps1')
          foreach($file in $files){
            $tokens=$null; $parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count){throw "PowerShell syntax errors: $($file.Name)"}
          }
          & ./installer/tests/test-safe-postgres-config.ps1
          & ./installer/tests/test-install-plan.ps1
          & ./installer/tests/test-release-runtime-guard.ps1
          & ./tests/test_release_switch.ps1
          & ./tests/test_release_recovery.ps1
          & ./installer/tests/test-rollback-plan.ps1
          & ./installer/tests/test-built-bundle-contract.ps1
          & ./installer/tests/test-legacy-rollback.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-release-repair-plan.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-audit-stage.ps1
          & ./installer/tests/test-install-apply.ps1
