name: ddl-free-runtime-pg18
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: ${{ (github.head_ref == 'audit/ddl-free-runtime-pg18-20261022' || github.ref_name == 'audit/ddl-free-runtime-pg18-20261022') && github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest==9.1.1 jsonschema==4.25.1 pglast==8.7 cryptography==50.0.2
      - name: Exact HEAD and strict offline regressions
        run: python tools/check_ddl_free_ci.py offline
      - name: PowerShell 7 syntax (parse only)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem installer -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw 'PowerShell syntax failure' }
          }
      - name: Windows PowerShell 5.1 syntax (parse only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem installer -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw 'Windows PowerShell syntax failure' }
          }
      - name: Synthetic Runtime Guard and LegacyRollback (no host execution)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & .\installer\tests\test-release-runtime-guard.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Guard regression failure' }
          & .\installer\tests\test-legacy-rollback.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'LegacyRollback regression failure' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ddl-offline-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ddl-offline.xml
            ddl-offline-events.json
            ddl-offline-sha256.json
          if-no-files-found: error
  pg18:
    if: ${{ (github.head_ref == 'audit/ddl-free-runtime-pg18-20261022' || github.ref_name == 'audit/ddl-free-runtime-pg18-20261022') && github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONPATH: .
      GRID_PG18_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest==9.1.1 cryptography==50.0.2
      - name: Create ONLY attested disposable CI container (never a physical host)
        run: python tools/ci_pg18.py start
      - name: Exact SHA, no skipped PostgreSQL 18 regressions
        run: python tools/check_ddl_free_ci.py pg18
      - name: Dispose only this run-owned CI container
        if: always() && env.GRID_PG18_CONTAINER != ''
        run: python tools/ci_pg18.py stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ddl-pg18-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ddl-pg18.xml
            ddl-pg18-events.json
            ddl-pg18-sha256.json
            pg18-provider.json
          if-no-files-found: error
