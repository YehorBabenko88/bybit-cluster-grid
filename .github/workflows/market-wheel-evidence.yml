name: Grid legacy wheel evidence (superseded by market-data; pending retirement)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Stage the legacy Grid wheel build root (root packaging is now canonical market-data)
        shell: bash
        run: |
          stage="$RUNNER_TEMP/grid-legacy-wheel"
          mkdir -p "$stage"
          cp -R grid "$stage/grid"
          cp legacy/grid-market-wheel/pyproject.toml legacy/grid-market-wheel/setup.py legacy/grid-market-wheel/MANIFEST.in legacy/grid-market-wheel/market-wheel-modules.txt "$stage/"
          python -m pip wheel --no-deps --wheel-dir dist "$stage"
      - shell: bash
        run: python -m pip install dist/*.whl
      - run: python -I scripts/check_market_wheel.py --head "${{ env.EXPECTED_HEAD }}" --wheel-dir dist --output grid-wheel.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grid-wheel-evidence-${{ runner.os }}-${{ matrix.python }}-${{ env.EXPECTED_HEAD }}
          path: grid-wheel.json
          if-no-files-found: error
