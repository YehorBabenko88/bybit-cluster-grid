name: Grid installed wheel evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --no-deps --find-links dist unified-grid-market-data
      - run: python -I scripts/check_market_wheel.py --head "${{ env.EXPECTED_HEAD }}" --wheel-dir dist --output grid-wheel.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grid-wheel-evidence-${{ runner.os }}-${{ matrix.python }}-${{ env.EXPECTED_HEAD }}
          path: grid-wheel.json
          if-no-files-found: error
