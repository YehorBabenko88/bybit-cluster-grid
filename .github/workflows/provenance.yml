name: source-provenance
on:
  pull_request:
  push:
    branches: [codex/provenance-b]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest "psycopg[binary]"
      - run: python -m pytest -q tests/test_source_provenance.py tests/test_terminan_gateway_contract.py tests/test_storage_footprint_revision.py tests/test_storage_canonical_replay.py tests/test_migration_history_guard.py
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fixture" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest "psycopg[binary]"
      - run: python -m pytest -q tests/test_source_provenance.py tests/test_terminan_gateway_contract.py
        env:
          TERMINAN_DISPOSABLE_PG18_DSN: postgresql://fixture:fixture@127.0.0.1:5432/fixture
