name: ls5-trusted-bootstrap-offline
on:
  pull_request:
    paths:
      - "installer/trusted_bootstrap.py"
      - "tests/test_ls5_trusted_bootstrap.py"
      - "docs/LS5_TRUSTED_BOOTSTRAP.md"
      - ".github/workflows/ls5-trusted-bootstrap-offline.yml"
  push:
    branches:
      - "parallel/ls5-trusted-bootstrap-20261024"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Syntax and bytecode validation
        run: python -m py_compile installer/trusted_bootstrap.py tests/test_ls5_trusted_bootstrap.py
      - name: Offline negative regression tests
        run: python -m pytest -q -ra tests/test_ls5_trusted_bootstrap.py
