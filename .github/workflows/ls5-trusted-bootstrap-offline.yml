name: ls5-trusted-bootstrap-offline
on:
  pull_request:
    paths:
      - "installer/trusted_bootstrap.py"
      - "tests/test_ls5_trusted_bootstrap.py"
      - "tests/test_ls5_bootstrap_ci_evidence.py"
      - "installer/ls5_bootstrap_ci_evidence.py"
      - "docs/LS5_TRUSTED_BOOTSTRAP.md"
      - "docs/LS5_TRUSTED_SOURCE_HANDOFF.md"
      - ".github/workflows/ls5-trusted-bootstrap-offline.yml"
  push:
    branches:
      - "parallel/ls5-trusted-bootstrap-20261024"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Syntax and bytecode validation
        run: python -m py_compile installer/trusted_bootstrap.py installer/ls5_bootstrap_ci_evidence.py tests/test_ls5_trusted_bootstrap.py tests/test_ls5_bootstrap_ci_evidence.py
      - name: Offline negative regression tests
        run: python -m pytest -q -ra tests/test_ls5_trusted_bootstrap.py tests/test_ls5_bootstrap_ci_evidence.py --junitxml=junit.xml
      - name: Exact-HEAD evidence receipts
        if: always()
        env:
          LS5_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python installer/ls5_bootstrap_ci_evidence.py junit.xml evidence
      - name: Upload immutable per-run offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ls5-bootstrap-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
