name: ls5-network-offline
on:
  pull_request:
    paths:
      - 'installer/ls5_network_offline.py'
      - 'tests/test_ls5_network_offline.py'
      - 'docs/LS5_NETWORK_READINESS.md'
      - 'tools/collect_ls5_network_readonly.ps1'
      - '.github/workflows/ls5-network-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.head_ref == 'parallel/ls5-network-preflight-20261024' || github.ref_name == 'parallel/ls5-network-preflight-20261024'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - name: Exact head, pure negative network policy tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m compileall -q installer/ls5_network_offline.py tests/test_ls5_network_offline.py
          python -m pytest -q tests/test_ls5_network_offline.py --junitxml=network-offline.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ls5-network-offline-${{ matrix.os }}-${{ matrix.python }}
          path: network-offline.xml
          if-no-files-found: error
