name: ls5-network-offline
on:
  pull_request:
    paths:
      - 'installer/ls5_network_offline.py'
      - 'tests/test_ls5_network_offline.py'
      - 'docs/LS5_NETWORK_READINESS.md'
      - 'docs/ISOLATED_AGENT_NETWORK_CONTRACT.md'
      - 'docs/LS5_PC4_G0_NETWORK_HANDOFF.md'
      - 'docs/NETWORK_PHYSICAL_READINESS.md'
      - 'docs/PR244_NETWORK_INDEPENDENT_REVIEW.md'
      - 'tools/collect_ls5_network_readonly.ps1'
      - '.github/workflows/ls5-network-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: (github.head_ref == 'parallel/ls5-network-preflight-20261024' || github.ref_name == 'parallel/ls5-network-preflight-20261024') && (github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020') && (github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021') && (github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020') && (github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020') && (github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021') && (github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - name: Exact head, pure negative network policy tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "import os,subprocess; actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); expected=os.environ['EXPECTED_SHA']; assert actual==expected,(actual,expected)"
          python -m compileall -q installer/ls5_network_offline.py tests/test_ls5_network_offline.py
          python -m pytest -q tests/test_ls5_network_offline.py --junitxml=network-offline.xml
      - name: Windows PowerShell collector parse-only gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/collect_ls5_network_readonly.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0 -or $null -eq $ast) { throw 'COLLECTOR_AST_PARSE_FAILED' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ls5-network-offline-${{ matrix.os }}-${{ matrix.python }}
          path: network-offline.xml
          if-no-files-found: error
