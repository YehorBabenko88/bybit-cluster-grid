name: physical-deployment-harness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-harness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-failure-evidence:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'audit/pr227-adversarial-20261023' && github.ref_name != 'audit/pr227-adversarial-20261023' && github.head_ref != 'audit/ddl-free-runtime-pg18-20261022' && github.ref_name != 'audit/ddl-free-runtime-pg18-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRID_SHARED_TOKEN: test-token
      POSTGRES_DSN: ''
      GRID_DISPOSABLE_POSTGRES_TESTS: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Run reviewed synthetic fault boundaries (IP and DB forbidden)
        run: |
          python - <<'PY'
          import subprocess,sys
          from installer.physical_deployment_harness import SCENARIOS
          selectors=[s for row in SCENARIOS.values() for s in row['selectors']]
          subprocess.run(['sudo','-E','unshare','--net',sys.executable,'-m','pytest','-q','-p','installer.tests.physical_network_guard',
                          '--junitxml=physical-junit.xml',*selectors],check=True)
          PY
      - name: Convert actual JUnit to scoped JSON and human report
        if: always()
        run: |
          evidence_exit=0
          python -B installer/physical_deployment_harness.py --junit physical-junit.xml --commit '${{ github.event.pull_request.head.sha || github.sha }}' --workflow-run-id '${{ github.run_id }}' > physical-results.json || evidence_exit=$?
          python -B installer/physical_deployment_harness.py --junit physical-junit.xml --commit '${{ github.event.pull_request.head.sha || github.sha }}' --workflow-run-id '${{ github.run_id }}' --format markdown > physical-results.md || evidence_exit=$?
          exit "$evidence_exit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: physical-synthetic-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            physical-junit.xml
            physical-results.json
            physical-results.md
          if-no-files-found: error
  windows-plan-compatibility:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'audit/pr227-adversarial-20261023' && github.ref_name != 'audit/pr227-adversarial-20261023' && github.head_ref != 'audit/ddl-free-runtime-pg18-20261022' && github.ref_name != 'audit/ddl-free-runtime-pg18-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Python plan and reporting regressions
        run: python -m pytest -q tests/test_physical_deployment_harness.py tests/test_isolated_release_preflight.py
      - name: PowerShell 7 synthetic inventory and plans
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./installer/tests/test-physical-inventory.ps1
          & ./installer/tests/test-physical-harness.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-isolated-deployment.ps1 -Python (Get-Command python).Source
      - name: Windows PowerShell 5.1 synthetic inventory and plans
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./installer/tests/test-physical-inventory.ps1
          & ./installer/tests/test-physical-harness.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-isolated-deployment.ps1 -Python (Get-Command python).Source
