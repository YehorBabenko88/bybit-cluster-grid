name: isolated-postgres-offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-pg-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-python:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Offline plan and evidence tests; no network namespace interfaces
        run: |
          python - <<'PY'
          import subprocess,sys
          subprocess.run(['sudo','-E','unshare','--net',sys.executable,'-B','-m','pytest','-q',
                          'tests/test_isolated_postgres_plan.py','tests/test_isolated_postgres_preflight.py',
                          'tests/test_isolated_postgres_mapping.py','tests/test_isolated_ownership_contract.py','tests/test_ownership_session_prototype.py','tests/test_ownership_adversarial_model.py','tests/test_ownership_threat_boundary.py','tests/test_vm_lab_plan.py','tests/test_vm_lab_robustness.py','tests/test_vm_lab_evidence.py','tests/test_vm_replay_model.py'],check=True)
          PY
      - name: Isolated pinned test-key crypto wheels
        shell: bash
        run: |
          crypto_env="$RUNNER_TEMP/vm-test-crypto-${{ matrix.python }}-${{ github.run_attempt }}"
          python -m venv "$crypto_env"
          "$crypto_env/bin/python" -m pip install pytest
          "$crypto_env/bin/python" -m pip install --only-binary=:all: --require-hashes -r installer/tests/requirements-vm-attestation.txt
      - name: Offline test-key signatures (34 required, no skips)
        shell: bash
        env:
          GRID_REQUIRE_TEST_ATTESTATION: '1'
        run: |
          crypto_python="$RUNNER_TEMP/vm-test-crypto-${{ matrix.python }}-${{ github.run_attempt }}/bin/python"
          sudo -E unshare --net "$crypto_python" -B -m pytest -q tests/test_vm_test_attestation.py --junitxml "$RUNNER_TEMP/test-signatures.xml"
          "$crypto_python" -B -c "import sys,xml.etree.ElementTree as E; s=list(E.parse(sys.argv[1]).iter('testsuite')); assert sum(int(x.get('tests',0)) for x in s)==34; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))" "$RUNNER_TEMP/test-signatures.xml"
          sudo -E unshare --net "$crypto_python" -B -m pytest -q tests/test_vm_attestation_adversarial.py --junitxml "$RUNNER_TEMP/adversarial-signatures.xml"
          "$crypto_python" -B -c "import sys,xml.etree.ElementTree as E; s=list(E.parse(sys.argv[1]).iter('testsuite')); assert sum(int(x.get('tests',0)) for x in s)==9; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))" "$RUNNER_TEMP/adversarial-signatures.xml"
  windows-readonly:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -B -m pytest -q tests/test_isolated_postgres_plan.py tests/test_isolated_postgres_preflight.py tests/test_isolated_postgres_windows_contract.py tests/test_isolated_postgres_mapping.py tests/test_isolated_ownership_contract.py tests/test_ownership_session_prototype.py tests/test_ownership_adversarial_model.py tests/test_ownership_threat_boundary.py tests/test_vm_lab_plan.py tests/test_vm_lab_robustness.py tests/test_vm_lab_evidence.py tests/test_vm_replay_model.py
      - name: PowerShell 7 mocked read-only snapshot and journal failure fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./installer/tests/test-isolated-postgres-readonly.ps1
          & ./installer/tests/test-isolated-ownership-contract.ps1
          & ./installer/tests/test-ownership-session-prototype.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-ownership-threat-boundary.ps1 -Python (Get-Command python).Source
          # Regression: native stdin must remain strict JSON even with a BOM-producing host encoding.
          $priorEncoding=$OutputEncoding
          try {
            $OutputEncoding=New-Object System.Text.UTF8Encoding($true)
            & ./installer/tests/test-vm-lab-plan.ps1 -Python (Get-Command python).Source
            & ./installer/tests/test-vm-lab-evidence.ps1 -Python (Get-Command python).Source
            & ./installer/tests/test-vm-replay-model.ps1 -Python (Get-Command python).Source
          } finally { $OutputEncoding=$priorEncoding }
          & ./installer/tests/test-isolated-deployment.ps1 -Python (Get-Command python).Source
      - name: PowerShell 5.1 mocked read-only snapshot and journal failure fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./installer/tests/test-isolated-postgres-readonly.ps1
          & ./installer/tests/test-isolated-ownership-contract.ps1
          & ./installer/tests/test-ownership-session-prototype.ps1 -Python (Get-Command python).Source
          & ./installer/tests/test-ownership-threat-boundary.ps1 -Python (Get-Command python).Source
          # Regression: native stdin must remain strict JSON even with a BOM-producing host encoding.
          $priorEncoding=$OutputEncoding
          try {
            $OutputEncoding=New-Object System.Text.UTF8Encoding($true)
            & ./installer/tests/test-vm-lab-plan.ps1 -Python (Get-Command python).Source
            & ./installer/tests/test-vm-lab-evidence.ps1 -Python (Get-Command python).Source
            & ./installer/tests/test-vm-replay-model.ps1 -Python (Get-Command python).Source
          } finally { $OutputEncoding=$priorEncoding }
          & ./installer/tests/test-isolated-deployment.ps1 -Python (Get-Command python).Source

      - name: Native handle lifetime in disposable GUID fixtures (17 required)
        shell: pwsh
        env:
          GRID_OWNERSHIP_NATIVE_FIXTURES: '1'
        run: |
          $ErrorActionPreference='Stop'
          $report=Join-Path $env:RUNNER_TEMP 'native-ownership17.xml'
          python -B -m pytest -q tests/test_ownership_native_fixture.py --junitxml $report
          if($LASTEXITCODE -ne 0){throw 'Native fixture tests failed'}
          python -B -c "import sys,xml.etree.ElementTree as E; s=list(E.parse(sys.argv[1]).iter('testsuite')); assert sum(int(x.get('tests',0)) for x in s)==17; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))" $report
          if($LASTEXITCODE -ne 0){throw 'All17 native fixtures must execute without skips'}
      - name: PS7 native fixture launcher compatibility
        shell: pwsh
        env:
          GRID_OWNERSHIP_NATIVE_FIXTURES: '1'
        run: ./installer/tests/test-ownership-session-prototype.ps1 -Python (Get-Command python).Source -Native
      - name: PS5.1 native fixture launcher compatibility
        shell: powershell
        env:
          GRID_OWNERSHIP_NATIVE_FIXTURES: '1'
        run: ./installer/tests/test-ownership-session-prototype.ps1 -Python (Get-Command python).Source -Native

      - name: Real adversarial GUID fixtures with explicit unproven accounting
        shell: pwsh
        env:
          GRID_OWNERSHIP_NATIVE_FIXTURES: '1'
        run: |
          $ErrorActionPreference='Stop'
          $junit=Join-Path $env:RUNNER_TEMP 'ownership-adversarial.xml'
          $evidence=Join-Path $env:RUNNER_TEMP 'ownership-adversarial.json'
          python -B -m pytest -q -rA tests/test_ownership_native_adversarial.py -o junit_family=xunit1 --junitxml $junit
          if($LASTEXITCODE -ne 0){throw 'Adversarial native test failed'}
          python -B installer/tests/verify_ownership_adversarial.py --junit $junit --output $evidence --commit ${{ github.event.pull_request.head.sha || github.sha }}
          if($LASTEXITCODE -ne 0){throw 'Adversarial evidence incomplete or silently skipped'}
      - name: Preserve tested and BLOCKED_UNPROVEN native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ownership-adversarial-${{ matrix.python }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ownership-adversarial.xml
            ${{ runner.temp }}/ownership-adversarial.json
          if-no-files-found: error

      - name: Isolated pinned test-key crypto wheels
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $crypto=Join-Path $env:RUNNER_TEMP 'vm-test-crypto-${{ matrix.python }}-${{ github.run_attempt }}'
          python -m venv $crypto
          if($LASTEXITCODE -ne 0){throw 'Crypto test venv failed'}
          $cp=Join-Path $crypto 'Scripts/python.exe'
          & $cp -m pip install pytest
          if($LASTEXITCODE -ne 0){throw 'Crypto pytest unavailable'}
          & $cp -m pip install --only-binary=:all: --require-hashes -r installer/tests/requirements-vm-attestation.txt
          if($LASTEXITCODE -ne 0){throw 'Pinned binary crypto dependencies unavailable'}
      - name: Test-key signatures (34 required, no skips)
        shell: pwsh
        env:
          GRID_REQUIRE_TEST_ATTESTATION: '1'
        run: |
          $cp=Join-Path $env:RUNNER_TEMP 'vm-test-crypto-${{ matrix.python }}-${{ github.run_attempt }}/Scripts/python.exe'
          $report=Join-Path $env:RUNNER_TEMP 'test-signatures.xml'
          & $cp -B -m pytest -q tests/test_vm_test_attestation.py --junitxml $report
          if($LASTEXITCODE -ne 0){throw 'Signature regressions failed'}
          & $cp -B -c "import sys,xml.etree.ElementTree as E; s=list(E.parse(sys.argv[1]).iter('testsuite')); assert sum(int(x.get('tests',0)) for x in s)==34; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))" $report
          if($LASTEXITCODE -ne 0){throw 'Signature cases missing or skipped'}
          $adversarial=Join-Path $env:RUNNER_TEMP 'adversarial-signatures.xml'
          & $cp -B -m pytest -q tests/test_vm_attestation_adversarial.py --junitxml $adversarial
          if($LASTEXITCODE -ne 0){throw 'Adversarial signature regressions failed'}
          & $cp -B -c "import sys,xml.etree.ElementTree as E; s=list(E.parse(sys.argv[1]).iter('testsuite')); assert sum(int(x.get('tests',0)) for x in s)==9; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))" $adversarial
          if($LASTEXITCODE -ne 0){throw 'Adversarial signature cases missing or skipped'}
      - name: PS7 test-key-only fixture
        shell: pwsh
        run: ./installer/tests/test-vm-test-attestation.ps1 -Python (Join-Path $env:RUNNER_TEMP 'vm-test-crypto-${{ matrix.python }}-${{ github.run_attempt }}/Scripts/python.exe')
      - name: PS5.1 test-key-only fixture
        shell: powershell
        run: ./installer/tests/test-vm-test-attestation.ps1 -Python (Join-Path $env:RUNNER_TEMP 'vm-test-crypto-${{ matrix.python }}-${{ github.run_attempt }}/Scripts/python.exe')
