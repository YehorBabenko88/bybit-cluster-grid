name: isolated-postgres-offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-pg-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Offline plan and evidence tests; no network namespace interfaces
        run: |
          python - <<'PY'
          import subprocess,sys
          subprocess.run(['sudo','-E','unshare','--net',sys.executable,'-B','-m','pytest','-q',
                          'tests/test_isolated_postgres_plan.py','tests/test_isolated_postgres_preflight.py',
                          'tests/test_isolated_postgres_mapping.py'],check=True)
          PY
  windows-readonly:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -B -m pytest -q tests/test_isolated_postgres_plan.py tests/test_isolated_postgres_preflight.py tests/test_isolated_postgres_windows_contract.py tests/test_isolated_postgres_mapping.py
      - name: PowerShell 7 mocked read-only snapshot and journal failure fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./installer/tests/test-isolated-postgres-readonly.ps1
          & ./installer/tests/test-isolated-deployment.ps1 -Python (Get-Command python).Source
      - name: PowerShell 5.1 mocked read-only snapshot and journal failure fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./installer/tests/test-isolated-postgres-readonly.ps1
          & ./installer/tests/test-isolated-deployment.ps1 -Python (Get-Command python).Source
