name: PGDATA physical readiness offline
on:
  pull_request:
    paths:
      - 'installer/pgdata_physical_readiness_offline.py'
      - 'tests/test_pgdata_physical_readiness_offline.py'
      - '.github/workflows/pgdata-physical-readiness-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    if: >-
      github.head_ref != 'planning/lab-airgap-a-20261021' &&
      github.head_ref != 'planning/windows-lab-l0-20261020' &&
      github.head_ref != 'planning/lab-witness-l1-20261020' &&
      github.head_ref != 'planning/pgdata-intent-v1-20261021' &&
      github.head_ref != 'planning/pgdata-physical-readiness-offline-20261021'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline syntax and negative tests (no PostgreSQL)
        shell: bash
        run: |
          python -m pip install pytest
          python -m compileall -q installer/pgdata_physical_readiness_offline.py tests/test_pgdata_physical_readiness_offline.py
          python -m pytest -q tests/test_pgdata_physical_readiness_offline.py
