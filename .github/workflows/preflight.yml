name: preflight

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: grid
          POSTGRES_DB: grid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grid -d grid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRID_SHARED_TOKEN: test-token
      POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install test dependencies
        run: pip install pytest
      - name: Compile
        run: python -m compileall -q grid run_worker.py run_coordinator.py
      - name: Import smoke test
        env:
          GRID_SHARED_TOKEN: test-token
          POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
        run: python -c "import grid.config, grid.worker, grid.coordinator, grid.control_plane, grid.enrollment, grid.update_manager"
      - name: Unit tests
        run: python -m pytest -q
      - name: Enrollment lifecycle integration tests
        run: python -m pytest -q tests/test_enrollment_postgres_integration.py
