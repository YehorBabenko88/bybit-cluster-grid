name: preflight

on:
  push:
    branches:
      - main
      - audit/migration48-ci-20261014
      - audit/codex-schema48-recovery-plan
      - audit/integration-issue185-wal-20261015
  pull_request:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-preflight:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'audit/ddl-free-runtime-pg18-20261022' && github.ref_name != 'audit/ddl-free-runtime-pg18-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: grid
          POSTGRES_DB: grid
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --label grid.audit.disposable=1
          --label grid.audit.run_id=${{ github.run_id }}
          --label grid.audit.run_attempt=${{ github.run_attempt }}
          --label grid.audit.repository=${{ github.repository }}
          --health-cmd "pg_isready -U grid -d grid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRID_SHARED_TOKEN: test-token
      POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
      GRID_REQUIRE_COMPOSED_GATES: '1'
      GRID_DISPOSABLE_POSTGRES_TESTS: '1'
      AUDIT_GRID_ROOT: ${{ github.workspace }}
      AUDIT_STRATTESTER_ROOT: ${{ github.workspace }}/.audit-contracts/strattester
      AUDIT_TERMINAN_ROOT: ${{ github.workspace }}/.audit-contracts/terminan
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned Strattester source for offline contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/strattester
          ref: 37ff7e9d12a4d2dccd788fc493c28557dbe8bcea
          path: .audit-contracts/strattester
          persist-credentials: false
      - name: Checkout pinned Terminan source for offline contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/Terminan
          ref: c711f9ce13678e3777c9707a2f34b5c30ce2dbb8
          path: .audit-contracts/terminan
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bind disposable PostgreSQL proof to current service container
        env:
          GRID_CI_SERVICE_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          python - <<'PY'
          import os,re
          value=os.environ['GRID_CI_SERVICE_CONTAINER_ID']
          assert re.fullmatch('[0-9a-f]{64}',value)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('GRID_TEST_POSTGRES_CONTAINER_ID='+value+'\n')
          PY
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install test dependencies
        run: pip install pytest
      - name: Mandatory disposable PostgreSQL isolation gate
        run: |
          python - <<'PY'
          import asyncio,sys
          sys.path.insert(0,'tests')
          from _postgres_test_database import disposable_database
          async def verify():
              async with disposable_database():
                  pass
          asyncio.run(verify())
          print('CI_POSTGRES_ISOLATION_READY')
          PY
      - name: Compile
        run: python -m compileall -q grid tests run_worker.py run_coordinator.py
      - name: Import smoke test
        env:
          GRID_SHARED_TOKEN: test-token
          POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
        run: python -c "import grid.config, grid.worker, grid.coordinator, grid.control_plane, grid.enrollment, grid.update_manager"
      - name: Independent raw writer PostgreSQL fences
        run: python -m pytest -q tests/test_raw_writer_fences_postgres.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Network-forbidden pinned three-repository contracts
        run: python -m pytest -q tests/test_composed_cross_repository_contracts.py
      - name: Windows commissioning read-only checks and clean PostgreSQL retention bootstrap
        run: python -m pytest -q tests/test_windows_preflight.py tests/test_windows_preflight_postgres.py tests/test_retention_bootstrap_regression.py
      - name: Enrollment lifecycle integration tests
        run: python -m pytest -q tests/test_enrollment_postgres_integration.py
      - name: ML dispatch lock PostgreSQL integration
        run: python -m pytest -q tests/test_ml_dispatch_lock_postgres.py
      - name: ML lease lifecycle PostgreSQL integration
        run: python -m pytest -q tests/test_ml_lease_lifecycle_postgres.py
      - name: Collection ownership PostgreSQL races
        run: python -m pytest -q tests/test_collection_ownership_postgres.py
      - name: CONTROL runtime PostgreSQL fencing
        run: python -m pytest -q tests/test_control_runtime_postgres.py
      - name: WAL OS process ownership
        run: python -m pytest -q tests/test_wal_process_ownership.py
      - name: Source capture PostgreSQL quarantine
        run: python -m pytest -q tests/test_capture_evidence_postgres.py
      - name: Collector process crash source capture
        run: python -m pytest -q tests/test_public_trade_capture.py
      - name: Migration48 public index and transaction safety
        run: python -m pytest -q tests/test_migration48_postgres.py
      - name: Migration47 upgrade and old catalogue refusal
        run: python -m pytest -q tests/test_migration47_upgrade_postgres.py
      - name: Composed sender takeover replay and lease transport deadlines
        run: python -m pytest -q tests/test_composed_recovery_postgres.py tests/test_composed_lease_deadline.py tests/test_composed_tape_ownership.py
      - name: Failure-recovery stress gates
        run: >-
          python -m pytest -q
          tests/test_failure_recovery.py
          tests/test_long_outage_recovery.py
          tests/test_spool.py
          tests/test_floating_control_plane.py
          tests/test_bybit_resilience.py
          tests/test_ml_concurrency.py
          tests/test_ml_retry.py
          tests/test_ml_process_supervisor.py
          tests/test_ml_publication_fence.py
