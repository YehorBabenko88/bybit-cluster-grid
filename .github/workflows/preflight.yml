name: preflight

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: grid
          POSTGRES_DB: grid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grid -d grid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRID_SHARED_TOKEN: test-token
      POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install test dependencies
        run: pip install pytest
      - name: Compile
        run: python -m compileall -q grid run_worker.py run_coordinator.py
      - name: Import smoke test
        env:
          GRID_SHARED_TOKEN: test-token
          POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
        run: python -c "import grid.config, grid.worker, grid.coordinator, grid.control_plane, grid.enrollment, grid.update_manager"
      - name: Unit tests
        run: python -m pytest -q
      - name: Production evaluation PostgreSQL integration test
        run: python -m pytest -q tests/test_production_evaluation_postgres_integration.py
      - name: Scientific simulation PostgreSQL concurrency integration
        run: python -m pytest -q tests/test_scientific_simulation_postgres_integration.py
      - name: Enrollment lifecycle integration tests
        run: python -m pytest -q tests/test_enrollment_postgres_integration.py
      - name: Failure-recovery stress gates
        run: >-
          python -m pytest -q
          tests/test_failure_recovery.py
          tests/test_long_outage_recovery.py
          tests/test_spool.py
          tests/test_floating_control_plane.py
          tests/test_bybit_resilience.py
          tests/test_ml_concurrency.py
          tests/test_ml_retry.py
          tests/test_ml_process_supervisor.py
          tests/test_ml_publication_fence.py
