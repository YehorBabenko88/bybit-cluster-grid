name: history-integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head synthetic checks
        run: python scripts/history_ci.py tests 'test_history*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: history-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .history-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: history-log-${{ runner.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .history-evidence/tests.log
          include-hidden-files: true
          if-no-files-found: error
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U fixture" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install "psycopg[binary]==3.3.2"
      - run: python scripts/history_ci.py tests 'test_history*.py'
        env:
          HISTORY_DISPOSABLE_DSN: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: history-disposable-${{ github.event.pull_request.head.sha || github.sha }}
          path: .history-evidence/
          include-hidden-files: true
          if-no-files-found: error
