name: pc4-g0-lsa-readonly
on:
  pull_request:
    paths: ['lab/lsa-readonly/**', 'installer/g0_lsa_evidence.py', 'tests/test_g0_lsa_evidence.py', 'tests/test_lsa_readonly.py', 'tests/fixtures/g0_lsa_inventory.json', 'tools/g0_lsa_ci.py', '.github/workflows/pc4-g0-lsa-readonly.yml']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lsa-model:
    if: ${{ (github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021') && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
        python: ['3.11', '3.12']
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - name: Exact source and pure Python contracts
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD) -cne $env:EXACT_HEAD_SHA){throw 'HEAD_MISMATCH'}
          New-Item -ItemType Directory g0-lsa-evidence -ErrorAction Stop | Out-Null
          python -m pytest tests/test_g0_lsa_evidence.py tests/test_lsa_readonly.py -q --junitxml=g0-lsa-evidence/python.xml
          if($LASTEXITCODE -ne 0){throw 'PYTHON_TESTS_FAILED'}
      - name: Offline compiler and fake APIs only, never PC4 or real LSA
        run: |
          $ErrorActionPreference='Stop'
          $owned=Join-Path $env:RUNNER_TEMP ('g0-lsa-'+[guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($owned)
          $testDll=Join-Path $owned 'G0Lsa.Tests.dll'
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File lab/lsa-readonly/Build-G0Memory.ps1 -Tests -Output $testDll
          if($LASTEXITCODE -ne 0){throw 'FAKE_BUILD_FAILED'}
          $prod=Join-Path $PWD 'g0-lsa-evidence/G0Lsa.Observer.dll'
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -File lab/lsa-readonly/Build-G0Memory.ps1 -Output $prod
          if($LASTEXITCODE -ne 0){throw 'PRODUCTION_BUILD_FAILED'}
          $raw=@(& ./lab/lsa-readonly/Test-G0Memory.ps1 -TestAssembly $testDll)
          [IO.File]::WriteAllText((Join-Path $PWD 'g0-lsa-evidence/fake.json'),($raw -join "`n"),[Text.UTF8Encoding]::new($false))
          python -m tools.g0_lsa_ci create g0-lsa-evidence $env:EXACT_HEAD_SHA $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT
          if($LASTEXITCODE -ne 0){throw 'RECEIPT_FAILED'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g0-lsa-${{ matrix.shell }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: g0-lsa-evidence/
          if-no-files-found: error
  required-g0-lsa:
    if: ${{ (always() && !cancelled()) && (github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021') && github.head_ref != 'audit/lsa-failclosed-20261021' && github.ref_name != 'audit/lsa-failclosed-20261021' && github.head_ref != 'audit/lsa-json-contract-20261021' && github.ref_name != 'audit/lsa-json-contract-20261021' && github.head_ref != 'audit/protected-staging-offline-20261022' && github.ref_name != 'audit/protected-staging-offline-20261022' && github.head_ref != 'planning/pc4-pg18-bootstrap-20261022' && github.ref_name != 'planning/pc4-pg18-bootstrap-20261022' }}
    needs: [lsa-model]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.lsa-model.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: g0-lsa-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: downloaded-g0
      - env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from tools.g0_lsa_ci import verify
          folders=list(Path('downloaded-g0').iterdir())
          if len(folders)!=4:raise SystemExit('MISSING_G0_MATRIX_ARTIFACT')
          for p in folders:print(verify(p,os.environ['EXACT_HEAD_SHA'],os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT']))
          PY
