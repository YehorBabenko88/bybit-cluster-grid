name: Canonical Market Data pure source and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '315532800'
  MARKET_DATA_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  pure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MARKET_DATA_TEST_SHA }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/math
          ref: 9e6acbd9e12a91189f57234828e31640983af553
          path: .source/math
          persist-credentials: false
      # F's reviewed qualifier is used as an offline verifier ONLY.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/unified-system
          ref: 8b639bc6b8adab477ca22ec4f69d6c5b867dc33a
          path: .source/f-qualification
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Build isolated pure wheels and test only inspected fixtures
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile
          root=pathlib.Path.cwd()
          subprocess.run([sys.executable,'-I','-B',str(root/'scripts/check_test_roster_controls.py')],check=True)
          subprocess.run([sys.executable,'-I','-B',str(root/'scripts/check_canonical_package_controls.py')],check=True)
          def committed_input(owner, source):
              if source.is_symlink() or not source.resolve(strict=True).is_relative_to(owner.resolve(strict=True)):
                  raise RuntimeError("build input escapes owned source checkout")
              relative=source.relative_to(owner).as_posix()
              committed=subprocess.check_output(['git','--no-replace-objects','-C',str(owner),'cat-file','blob','HEAD:'+relative])
              working=source.read_bytes()
              normalized=working.replace(b'\r\n',b'\n')
              if working!=committed and (normalized!=committed or b'\r' in working.replace(b'\r\n',b'')):
                  raise RuntimeError('build input differs from committed source')
              source.write_bytes(committed)
          for source in [root/'pyproject.toml',root/'MANIFEST.in',root/'README.md',*list((root/'market_data').glob('*.py')),*list((root/'market_data').glob('*.sql')),*list((root/'market_data_v2').glob('*.py')),*(root/p for p in ('grid/__init__.py','grid/canonical_lab_continuous_collector.py','grid/c_lab_journal_adapter.py','grid/canonical_lab_fenced_writer.py','grid/c_async_fenced_writer.py'))]:
              committed_input(root,source)
          math_root=root/'.source/math'
          assert subprocess.check_output(['git','-C',str(math_root),'rev-parse','HEAD'],text=True).strip()=='9e6acbd9e12a91189f57234828e31640983af553'
          assert subprocess.check_output(['git','-C',str(math_root),'rev-parse','HEAD:python/market_math.py'],text=True).strip()=='7d0e45f099b53bd1632d67bd059bc85540105329'
          for source in [math_root/'pyproject.toml',*list((math_root/'python').glob('*.py'))]:
              committed_input(math_root,source)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['MARKET_DATA_TEST_SHA']
          def run(*args, cwd=root):
              subprocess.run([sys.executable,*map(str,args)],cwd=cwd,check=True)
          run('-m','pip','install','setuptools>=75,<83','wheel','pytest==8.3.5','pytest-asyncio==0.26.0','aiohttp>=3.10,<4','psycopg[binary]>=3.2,<4','websockets>=15,<16')
          run('-I','-S','-B',root/'scripts/check_sdk_cache_path_controls.py')
          run('-I','-c','from setuptools.build_meta import build_wheel,build_sdist; build_wheel(".candidate-dist"); build_sdist(".candidate-dist")')
          run('-m','pip','wheel','--no-deps','--wheel-dir',root/'.dependency-wheels',root/'.source/math')
          wheel=next((root/'.dependency-wheels').glob('*.whl'))
          import json
          evidence=json.loads(subprocess.check_output([sys.executable,'-I',str(root/'scripts/check_market_package.py'),str(root),str(wheel)],text=True))
          print(json.dumps(evidence,sort_keys=True))
          proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-data-package-proof.json'
          if proof.exists(): raise RuntimeError('fresh package proof required')
          proof.write_text(json.dumps(evidence,sort_keys=True,indent=2))
          import runpy,sysconfig
          cache_api=runpy.run_path(str(root/'scripts/sdk_cache_custody.py'))
          with cache_api['fresh_sdk_cache'](source_roots=(root,)) as cache:
              run('-I','-S','-B','-X','pycache_prefix='+str(cache),root/'scripts/check_test_framework_controls.py',cache,'--dependencies',sysconfig.get_path('purelib'))
          with cache_api['fresh_sdk_cache'](source_roots=(root,)) as cache:
              run('-I','-S','-B','-X','pycache_prefix='+str(cache),root/'scripts/run_canonical_tests.py','--cache-root',cache,'--dependencies',sysconfig.get_path('purelib'),'--site',evidence['artifact_site'],'--bindings',proof,'--evidence',pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-data-tests.json',cwd=pathlib.Path(os.environ['RUNNER_TEMP']))
          print('PURE_OFFLINE_ONLY=PASS; NATIVE_LIVE_ORIGINAL_DATA=NOT_QUALIFIED')

      - name: Build evidence from REAL installed B9e0 wheel and exact F qualifier (no Root grant)
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root=pathlib.Path.cwd()
          f=root/'.source/f-qualification'
          expected='8b639bc6b8adab477ca22ec4f69d6c5b867dc33a'
          assert subprocess.check_output(['git','-C',str(f),'rev-parse','HEAD'],text=True).strip()==expected
          wheels=list((root/'.candidate-dist').glob('market_data-*.whl'))
          sdists=list((root/'.candidate-dist').glob('market_data-*.tar.gz'))
          math_wheels=list((root/'.dependency-wheels').glob('*.whl'))
          assert len(wheels)==len(sdists)==len(math_wheels)==1, 'EXACT_B9E0_AND_MATH_BUILD_REQUIRED'
          proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'b19-real-installed-wheel.json'
          subprocess.run([sys.executable,'-I','-B',str(root/'scripts/round19_install_actual_b9e0.py'),
                          '--root',str(root),'--wheel',str(wheels[0]),
                          '--sdist',str(sdists[0]),'--math-wheel',str(math_wheels[0]),
                          '--f-tool',str(f/'tools/f_wheel_qualification.py'),
                          '--output',str(proof)],check=True)
          assert proof.is_file(), 'B19_INSTALLED_RECORD_PROOF_MISSING'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/strattester
          ref: 3850995a6c28ed29b05cef4ba067e587d5033453
          path: .source/strattester
          persist-credentials: false
      - name: Verify source checkout and complete source-only custody evidence
        shell: python
        run: |
          import pathlib, runpy, subprocess, sys
          root=pathlib.Path.cwd()
          source=root/'.source/strattester'
          subprocess.run([sys.executable,str(root/'scripts/check_cross_repo_roster_partition.py')],check=True)
          materialize=runpy.run_path(str(root/'scripts/materialize_ci_sources.py'))['materialize']
          materialize(source,'3850995a6c28ed29b05cef4ba067e587d5033453',['market_data'])
          subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(root/'.source/math')],check=True)
          subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(source)],check=True)
          subprocess.run([sys.executable,str(root/'scripts/run_cross_repo_roster.py'),
                          '--scope','custody','--source-root',str(source),
                          '--evidence',str(pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'canonical-data-custody.json')],check=True)
      - name: Preserve canonical source and exact case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-data-${{ matrix.os }}-${{ matrix.python }}-${{ env.MARKET_DATA_TEST_SHA }}
          path: |
            ${{ runner.temp }}/canonical-data-package-proof.json
            ${{ runner.temp }}/canonical-data-tests.json
            ${{ runner.temp }}/canonical-data-custody.json
            ${{ runner.temp }}/b19-real-installed-wheel.json
            .candidate-dist/market_data-*.whl
            .candidate-dist/market_data-*.tar.gz
          if-no-files-found: error
