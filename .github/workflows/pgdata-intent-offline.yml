name: pgdata-intent-offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-offline:
    if: github.head_ref == 'planning/pgdata-intent-v1-20261021' || github.ref_name == 'planning/pgdata-intent-v1-20261021'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - name: Parse PowerShell 5.1 without executing scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem installer -Recurse -Filter '*.ps1')+@(Get-ChildItem tests -Filter '*.ps1')
          foreach($f in $files){$t=$null;$e=$null;[void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e);if($e.Count){throw "Parse failure $($f.Name)"}}
      - name: Parse PowerShell 7 without executing scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem installer -Recurse -Filter '*.ps1')+@(Get-ChildItem tests -Filter '*.ps1')
          foreach($f in $files){$t=$null;$e=$null;[void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e);if($e.Count){throw "Parse failure $($f.Name)"}}
      - name: Pure manifest and reused SID negative checks
        shell: bash
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          python - <<'PY'
          import json, os, pathlib, pytest, xml.etree.ElementTree as E
          inventory=json.loads(pathlib.Path('tests/fixtures/pgdata_intent_offline_inventory.json').read_text())
          events={'sha':os.environ['EXACT_HEAD_SHA'],'nodes':[],'calls':[],'bad_reports':[]}
          class Receipt:
              def pytest_collection_finish(self,session):
                  events['nodes']=sorted(x.nodeid for x in session.items)
              def pytest_runtest_logreport(self,report):
                  if hasattr(report,'wasxfail') or report.outcome != 'passed':
                      events['bad_reports'].append([report.nodeid,report.when,report.outcome])
                  if report.when=='call' and report.outcome=='passed':events['calls'].append(report.nodeid)
          code=pytest.main(['-q','-p','no:cacheprovider',*inventory['files'],'--junitxml','pgdata-intent.xml'],plugins=[Receipt()])
          pathlib.Path('pgdata-intent-events.json').write_text(json.dumps(events,sort_keys=True))
          assert code==0 and not events['bad_reports']
          assert events['nodes']==inventory['nodes']==sorted(events['calls'])
          s=list(E.parse('pgdata-intent.xml').iter('testsuite'))
          assert s and all(int(x.get(k,0))==0 for x in s for k in ('errors','failures','skipped'))
          assert sum(int(x.get('tests',0)) for x in s)==len(inventory['nodes'])
          assert len(list(E.parse('pgdata-intent.xml').iter('testcase')))==len(inventory['nodes'])
          cases=sorted([c.get('classname'),c.get('name')] for c in E.parse('pgdata-intent.xml').iter('testcase'))
          assert cases==inventory['junit_cases']
          print('Offline design metadata only; BLOCKED; physical NO-GO; no live evidence')
          PY
          python -B -m installer.lab_manifest_design < lab-manifest.example.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pgdata-intent-offline-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            pgdata-intent.xml
            pgdata-intent-events.json
          if-no-files-found: error
  static-workflows:
    if: github.head_ref == 'planning/pgdata-intent-v1-20261021' || github.ref_name == 'planning/pgdata-intent-v1-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
          git diff --check

