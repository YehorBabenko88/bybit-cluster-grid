name: physical-infra-readiness-offline

on:
  pull_request:
    paths:
      - "infra_readiness/**"
      - "tests/test_infra_readiness.py"
      - ".github/workflows/physical-infra-readiness-offline.yml"
      - "docs/PHYSICAL_WINDOWS_INFRA_READINESS.md"
  push:
    paths:
      - "infra_readiness/**"
      - "tests/test_infra_readiness.py"
      - ".github/workflows/physical-infra-readiness-offline.yml"
      - "docs/PHYSICAL_WINDOWS_INFRA_READINESS.md"

permissions:
  contents: read

jobs:
  offline:
    if: ${{ github.head_ref != 'review/offline-rc-20261020' && github.ref_name != 'review/offline-rc-20261020' && github.head_ref != 'planning/lab-airgap-a-20261021' && github.ref_name != 'planning/lab-airgap-a-20261021' && github.head_ref != 'planning/windows-lab-l0-20261020' && github.ref_name != 'planning/windows-lab-l0-20261020' && github.head_ref != 'planning/lab-witness-l1-20261020' && github.ref_name != 'planning/lab-witness-l1-20261020' && github.head_ref != 'audit/codex-pc4-sid-acl-20261021' && github.ref_name != 'audit/codex-pc4-sid-acl-20261021' && github.head_ref != 'planning/pgdata-intent-v1-20261021' && github.ref_name != 'planning/pgdata-intent-v1-20261021' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_infra_readiness.py
