name: pc4-sid-acl-offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-offline:
    if: github.head_ref == 'audit/codex-pc4-sid-acl-20261021' || github.ref_name == 'audit/codex-pc4-sid-acl-20261021' || github.head_ref == 'audit/lsa-failclosed-20261021' || github.ref_name == 'audit/lsa-failclosed-20261021' || github.head_ref == 'audit/lsa-json-contract-20261021' || github.ref_name == 'audit/lsa-json-contract-20261021'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - name: LSA source contracts, no native calls
        run: |
          python -m pytest -q tests/test_lsa_readonly.py --junitxml=lsa-source.xml
          python -c "import xml.etree.ElementTree as E; s=list(E.parse('lsa-source.xml').iter('testsuite')); assert sum(int(x.get('tests',0)) for x in s)==4; assert all(int(x.get(k,0))==0 for x in s for k in ('errors','failures','skipped'))"
      - name: LSA JSON consumption boundary, offline only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          python - <<'PY'
          import json, os, pathlib, pytest, xml.etree.ElementTree as E
          inventory=json.loads(pathlib.Path('tests/fixtures/lsa_report_contract_inventory.json').read_text())
          events={'sha':os.environ['EXACT_HEAD_SHA'],'nodes':[],'calls':[],'bad_reports':[]}
          class Receipt:
              def pytest_collection_finish(self,session):
                  events['nodes']=sorted(x.nodeid for x in session.items)
              def pytest_runtest_logreport(self,report):
                  if hasattr(report,'wasxfail') or report.outcome != 'passed':
                      events['bad_reports'].append([report.nodeid,report.when,report.outcome])
                  if report.when=='call' and report.outcome=='passed':events['calls'].append(report.nodeid)
          code=pytest.main(['-q','-p','no:cacheprovider',*inventory['files'],'--junitxml','lsa-contract.xml'],plugins=[Receipt()])
          pathlib.Path('lsa-contract-events.json').write_text(json.dumps(events,sort_keys=True))
          assert code==0 and not events['bad_reports']
          assert events['nodes']==inventory['nodes']==sorted(events['calls'])
          suites=list(E.parse('lsa-contract.xml').iter('testsuite'))
          assert suites and sum(int(x.get('tests',0)) for x in suites)==len(inventory['nodes'])
          assert all(int(x.get(k,0))==0 for x in suites for k in ('errors','failures','skipped'))
          assert sorted([c.get('classname'),c.get('name')] for c in E.parse('lsa-contract.xml').iter('testcase'))==inventory['junit_cases']
          print('LSA JSON contract only; BLOCKED; physical 0/10 NOT_RUN; Execute NOT_AUTHORIZED')
          PY
      - name: LSA mocked APIs on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $result=@(./lab/lsa-readonly/Test-Offline.ps1)
          if($result -notcontains 'LSA_MOCK_CASES=49; GROUP_CASES=24; PLAN_ONLY=1; NO_NATIVE_EXECUTION; NO_PHYSICAL_EVIDENCE'){throw 'LSA_MOCK_GATE_FAILED'}
          $result
          $plan=& ./lab/lsa-readonly/Get-LocalLogonRights.ps1
          $review=$plan | python -m installer.lsa_report_contract
          if($LASTEXITCODE -ne 0){throw 'LSA_PLAN_JSON_CONTRACT_REJECTED'}
          $v=$review | ConvertFrom-Json
          if($v.contract_valid -ne $true -or $v.status -cne 'BLOCKED' -or $v.execution_authorized -isnot [bool] -or $v.execution_authorized -ne $false){throw 'LSA_PLAN_JSON_CONTRACT_PROMOTION'}
          'LSA_PLAN_JSON_CONTRACT=BLOCKED; NO_NATIVE_EXECUTION'
      - name: LSA mocked APIs on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result=@(./lab/lsa-readonly/Test-Offline.ps1)
          if($result -notcontains 'LSA_MOCK_CASES=49; GROUP_CASES=24; PLAN_ONLY=1; NO_NATIVE_EXECUTION; NO_PHYSICAL_EVIDENCE'){throw 'LSA_MOCK_GATE_FAILED'}
          $result
          $plan=& ./lab/lsa-readonly/Get-LocalLogonRights.ps1
          $review=$plan | python -m installer.lsa_report_contract
          if($LASTEXITCODE -ne 0){throw 'LSA_PLAN_JSON_CONTRACT_REJECTED'}
          $v=$review | ConvertFrom-Json
          if($v.contract_valid -ne $true -or $v.status -cne 'BLOCKED' -or $v.execution_authorized -isnot [bool] -or $v.execution_authorized -ne $false){throw 'LSA_PLAN_JSON_CONTRACT_PROMOTION'}
          'LSA_PLAN_JSON_CONTRACT=BLOCKED; NO_NATIVE_EXECUTION'
      - name: Parse PowerShell 5.1 without executing scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem installer -Recurse -Filter '*.ps1')+@(Get-ChildItem tests -Filter '*.ps1')+@(Get-ChildItem lab/pc4 -Filter '*.ps1')
          foreach($f in $files){$t=$null;$e=$null;[void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e);if($e.Count){throw "Parse failure $($f.Name)"}}
      - name: Parse PowerShell 7 without executing scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem installer -Recurse -Filter '*.ps1')+@(Get-ChildItem tests -Filter '*.ps1')+@(Get-ChildItem lab/pc4 -Filter '*.ps1')
          foreach($f in $files){$t=$null;$e=$null;[void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName,[ref]$t,[ref]$e);if($e.Count){throw "Parse failure $($f.Name)"}}
      - name: Pure PC4 policies on PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $result=@(./lab/pc4/Test-Offline.ps1)
          if($result -notcontains 'OFFLINE_POLICY_CASES=39; NO_NATIVE_EXECUTION; NO_PHYSICAL_EVIDENCE'){throw 'OFFLINE_POLICY_INVENTORY_MISMATCH'}
          $result
      - name: Pure PC4 policies on PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result=@(./lab/pc4/Test-Offline.ps1)
          if($result -notcontains 'OFFLINE_POLICY_CASES=39; NO_NATIVE_EXECUTION; NO_PHYSICAL_EVIDENCE'){throw 'OFFLINE_POLICY_INVENTORY_MISMATCH'}
          $result
      - name: Compile package only, no native entry points
        if: runner.os == 'Windows'
        shell: powershell
        run: ./lab/pc4/Build-OfflinePackage.ps1
      - name: Verify compiled DLL loads on PowerShell 7 without native calls
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Type -Path (Join-Path $env:PC4_PACKAGE_PATH 'TokenFacts.dll')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: pc4-local-package-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.PC4_PACKAGE_PATH }}
          if-no-files-found: error
      - name: Pure manifest and reused SID negative checks
        shell: bash
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          python - <<'PY'
          import json, os, pathlib, pytest, xml.etree.ElementTree as E
          inventory=json.loads(pathlib.Path('tests/fixtures/pc4_sid_acl_offline_inventory.json').read_text())
          events={'sha':os.environ['EXACT_HEAD_SHA'],'nodes':[],'calls':[],'bad_reports':[]}
          class Receipt:
              def pytest_collection_finish(self,session):
                  events['nodes']=sorted(x.nodeid for x in session.items)
              def pytest_runtest_logreport(self,report):
                  if hasattr(report,'wasxfail') or report.outcome != 'passed':
                      events['bad_reports'].append([report.nodeid,report.when,report.outcome])
                  if report.when=='call' and report.outcome=='passed':events['calls'].append(report.nodeid)
          code=pytest.main(['-q','-p','no:cacheprovider',*inventory['files'],'--junitxml','pc4-offline.xml'],plugins=[Receipt()])
          pathlib.Path('pc4-offline-events.json').write_text(json.dumps(events,sort_keys=True))
          assert code==0 and not events['bad_reports']
          assert events['nodes']==inventory['nodes']==sorted(events['calls'])
          s=list(E.parse('pc4-offline.xml').iter('testsuite'))
          assert s and all(int(x.get(k,0))==0 for x in s for k in ('errors','failures','skipped'))
          assert sum(int(x.get('tests',0)) for x in s)==len(inventory['nodes'])
          assert len(list(E.parse('pc4-offline.xml').iter('testcase')))==len(inventory['nodes'])
          cases=sorted([c.get('classname'),c.get('name')] for c in E.parse('pc4-offline.xml').iter('testcase'))
          assert cases==inventory['junit_cases']
          print('Offline design metadata only; BLOCKED; physical NO-GO; no live evidence')
          PY
          python -B -m installer.lab_manifest_design < lab-manifest.example.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pc4-sid-acl-offline-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            pc4-offline.xml
            pc4-offline-events.json
            lsa-source.xml
            lsa-contract.xml
            lsa-contract-events.json
          if-no-files-found: error
  static-workflows:
    if: github.head_ref == 'audit/codex-pc4-sid-acl-20261021' || github.ref_name == 'audit/codex-pc4-sid-acl-20261021' || github.head_ref == 'audit/lsa-failclosed-20261021' || github.ref_name == 'audit/lsa-failclosed-20261021' || github.head_ref == 'audit/lsa-json-contract-20261021' || github.ref_name == 'audit/lsa-json-contract-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
          git diff --check

