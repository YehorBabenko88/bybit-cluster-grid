name: integration-evidence-audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-invariants:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline negative evidence contract tests
        run: python -m unittest discover -s tests -p 'test_integration_*.py' -v
