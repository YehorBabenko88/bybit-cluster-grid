name: windows-lab-planning
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-offline:
    if: github.head_ref == 'planning/windows-lab-l0-20261020' || github.ref_name == 'planning/windows-lab-l0-20261020'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - name: Pure manifest and reused SID negative checks
        shell: bash
        env:
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          python -B -m pytest -q -p no:cacheprovider tests/test_lab_manifest_design.py tests/test_vm_principal_evidence_binding.py --junitxml lab-planning.xml
          python - <<'PY'
          import xml.etree.ElementTree as E
          s=list(E.parse('lab-planning.xml').iter('testsuite'))
          assert s and all(int(x.get(k,0))==0 for x in s for k in ('errors','failures','skipped'))
          assert sum(int(x.get('tests',0)) for x in s)==107
          assert len(list(E.parse('lab-planning.xml').iter('testcase')))==107
          print('Offline design metadata only; BLOCKED; physical NO-GO; no live evidence')
          PY
          python -B -m installer.lab_manifest_design < lab-manifest.example.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-planning-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: lab-planning.xml
          if-no-files-found: error
  static-workflows:
    if: github.head_ref == 'planning/windows-lab-l0-20261020' || github.ref_name == 'planning/windows-lab-l0-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
          git diff --check
