name: protected-staging-offline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    if: github.head_ref == 'audit/ddl-free-runtime-pg18-20261022' || github.ref_name == 'audit/ddl-free-runtime-pg18-20261022' || github.head_ref == 'audit/protected-staging-offline-20261022' || github.ref_name == 'audit/protected-staging-offline-20261022' || github.head_ref == 'planning/pc4-pg18-bootstrap-20261022' || github.ref_name == 'planning/pc4-pg18-bootstrap-20261022' || github.head_ref == 'audit/pr227-adversarial-20261023' || github.ref_name == 'audit/pr227-adversarial-20261023'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1 jsonschema==4.25.1 pglast==8.7
      - name: Exact HEAD, strict inventories, separate JUnit and SHA256 receipts
        run: python tools/check_staging_offline.py
      - name: PostgreSQL18 plan syntax and safety contracts only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          from tools.check_staging_offline import run_suite
          run_suite('pc4_pg18_plan_inventory.json','pc4-pg18-plan')
          p=pathlib.Path('staging-sha256.json');m=json.loads(p.read_text())
          for name in ('pc4-pg18-plan.xml','pc4-pg18-plan-events.json'):
              m['files'][name]={'working_bytes_sha256':hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()}
          p.write_text(json.dumps(m,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-offline-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            staging-offline.xml
            staging-offline-events.json
            staging-baseline.xml
            staging-baseline-events.json
            staging-sha256.json
            pc4-pg18-plan.xml
            pc4-pg18-plan-events.json
          if-no-files-found: error
  static:
    if: github.head_ref == 'audit/ddl-free-runtime-pg18-20261022' || github.ref_name == 'audit/ddl-free-runtime-pg18-20261022' || github.head_ref == 'audit/protected-staging-offline-20261022' || github.ref_name == 'audit/protected-staging-offline-20261022' || github.head_ref == 'planning/pc4-pg18-bootstrap-20261022' || github.ref_name == 'planning/pc4-pg18-bootstrap-20261022' || github.head_ref == 'audit/pr227-adversarial-20261023' || github.ref_name == 'audit/pr227-adversarial-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
          git diff --check
