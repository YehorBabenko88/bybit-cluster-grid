name: Mission3 disposable source qualification
on:
  push:
    branches: ['mission3/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mission3-qualification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-postgres18:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: grid
          POSTGRES_DB: grid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grid -d grid"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GRID_SHARED_TOKEN: disposable-ci-only
      POSTGRES_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
      HISTORY_DISPOSABLE_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
      TERMINAN_DISPOSABLE_PG18_DSN: postgresql://grid:grid@127.0.0.1:5432/grid
      MISSION3_TEST_DATABASE_URL: postgresql://grid:grid@127.0.0.1:5432/grid
      UNIFIED_SOURCE_ROOT: ${{ github.workspace }}/upstream/unified-system
      EXPECTED_GRID_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/unified-system
          ref: 4534b3e044775dbd8c805d5aeaf147820c5afdf8
          path: upstream/unified-system
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify exact source and disposable PostgreSQL18
        run: |
          python - <<'PY'
          import os,subprocess,asyncio,asyncpg
          def git(root,arg):return subprocess.check_output(['git','-C',root,'rev-parse',arg],text=True).strip()
          assert git('.','HEAD')==os.environ['EXPECTED_GRID_SHA']
          assert git(os.environ['UNIFIED_SOURCE_ROOT'],'HEAD')=='4534b3e044775dbd8c805d5aeaf147820c5afdf8'
          async def verify():
              con=await asyncpg.connect(os.environ['POSTGRES_DSN'])
              try:assert 180000<=int(await con.fetchval('SHOW server_version_num'))<190000
              finally:await con.close()
          asyncio.run(verify())
          PY
      - name: Full suite with real disposable database
        id: tests
        run: python -m pytest -q --ignore=upstream --junitxml=mission3-tests.xml
      - name: Record exact source evidence
        if: always()
        shell: python
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          import json,os,pathlib,subprocess,hashlib
          def git(root,arg):return subprocess.check_output(['git','-C',root,'rev-parse',arg],text=True).strip()
          def source(root):return dict(head=git(root,'HEAD'),tree=git(root,'HEAD^{tree}'),tracked_clean=not bool(subprocess.check_output(['git','-C',root,'status','--porcelain','--untracked-files=no'])))
          p=pathlib.Path('mission3-tests.xml')
          report=dict(schema='grid.mission3.qualification.v1',grid=source('.'),unified=source(os.environ['UNIFIED_SOURCE_ROOT']),expected_grid_sha=os.environ['EXPECTED_GRID_SHA'],baseline_unified_sha='4534b3e044775dbd8c805d5aeaf147820c5afdf8',run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],job=os.environ['GITHUB_JOB'],tests=os.environ['TEST_OUTCOME'],junit_sha256=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,scope='DISPOSABLE_CLOUD_POSTGRES18',physical='NOT_RUN',external_host_execution=False,service_installation='NOT_RUN',multi_node_ha='NOT_QUALIFIED')
          pathlib.Path('mission3-source.json').write_text(json.dumps(report,sort_keys=True)+'\n')
          assert report['grid']['head']==report['expected_grid_sha'] and report['unified']['head']==report['baseline_unified_sha']
          assert report['grid']['tracked_clean'] and report['unified']['tracked_clean']
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mission3-linux-pg18-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mission3-source.json
            mission3-tests.xml
          if-no-files-found: error
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      UNIFIED_SOURCE_ROOT: ${{ github.workspace }}/upstream/unified-system
      EXPECTED_GRID_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: YehorBabenko88/unified-system
          ref: 4534b3e044775dbd8c805d5aeaf147820c5afdf8
          path: upstream/unified-system
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Exact Grid and Unified checkout fence
        shell: python
        run: |
          import os,subprocess
          def git(root):return subprocess.check_output(['git','-C',root,'rev-parse','HEAD'],text=True).strip()
          assert git('.')==os.environ['EXPECTED_GRID_SHA']
          assert git(os.environ['UNIFIED_SOURCE_ROOT'])=='4534b3e044775dbd8c805d5aeaf147820c5afdf8'
      - name: Disposable deployment-agent source tests
        id: tests
        shell: ${{ matrix.shell }}
        run: |
          python -m pytest -q tests/test_deployment_agent.py --junitxml=mission3-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Deployment agent tests failed' }
      - name: Actual PowerShell parser and CMS contracts only
        id: native
        shell: ${{ matrix.shell }}
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition)" | Tee-Object -FilePath mission3-native.txt
          & ./installer/mission3-contract.tests.ps1 -UnifiedRoot $env:UNIFIED_SOURCE_ROOT | Tee-Object -FilePath mission3-native.txt -Append
          if ($LASTEXITCODE -ne 0) { throw 'Native parser/CMS contracts failed' }
      - name: Record exact source evidence
        if: always()
        shell: python
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          import json,os,pathlib,subprocess,hashlib
          def git(root,arg):return subprocess.check_output(['git','-C',root,'rev-parse',arg],text=True).strip()
          def source(root):return dict(head=git(root,'HEAD'),tree=git(root,'HEAD^{tree}'),tracked_clean=not bool(subprocess.check_output(['git','-C',root,'status','--porcelain','--untracked-files=no'])))
          p=pathlib.Path('mission3-tests.xml')
          report=dict(schema='grid.mission3.qualification.v1',grid=source('.'),unified=source(os.environ['UNIFIED_SOURCE_ROOT']),expected_grid_sha=os.environ['EXPECTED_GRID_SHA'],baseline_unified_sha='4534b3e044775dbd8c805d5aeaf147820c5afdf8',run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],job=os.environ['GITHUB_JOB'],shell=os.environ['TEST_SHELL'],tests=os.environ['TEST_OUTCOME'],native_parser_cms=os.environ['NATIVE_OUTCOME'],junit_sha256=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,scope='GITHUB_HOSTED_WINDOWS_CONTRACTS',physical='NOT_RUN',external_host_execution=False,service_installation='NOT_RUN',multi_node_ha='NOT_QUALIFIED')
          pathlib.Path('mission3-source.json').write_text(json.dumps(report,sort_keys=True)+'\n')
          assert report['grid']['head']==report['expected_grid_sha'] and report['unified']['head']==report['baseline_unified_sha']
          assert report['grid']['tracked_clean'] and report['unified']['tracked_clean']
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mission3-windows-${{ matrix.shell }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mission3-source.json
            mission3-tests.xml
            mission3-native.txt
          if-no-files-found: error
