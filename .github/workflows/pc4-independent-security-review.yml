name: pc4-independent-security-review
on:
  pull_request:
    paths:
      - 'audit/pc4_independent_security_gate.py'
      - 'tests/test_pc4_independent_security_gate.py'
      - '.github/workflows/pc4-independent-security-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-security-review:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Exact checked out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Mandatory negative security gate tests
        run: python -m unittest discover -s tests -p test_pc4_independent_security_gate.py -v
