[build-system]
requires = ["setuptools>=75,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data"
version = "0.1.0"
description = "Canonical bounded public market acquisition and read-only historical data service"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "psycopg[binary]>=3.2,<4", "websockets>=15,<16"]

[project.optional-dependencies]
ingestion = ["asyncpg>=0.29,<1"]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]
# Retained pre-consolidation tests only; not canonical acquisition runtime dependencies.
legacy-test = ["requests>=2.31,<3", "psutil>=5.9,<8"]

[project.scripts]
market-data = "market_data.cli:main"

[tool.setuptools]
packages = ["market_data"]
include-package-data = false

[tool.setuptools.package-data]
market_data = ["schema.sql", "capture_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
