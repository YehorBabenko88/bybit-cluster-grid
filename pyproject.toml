[build-system]
requires = ["setuptools>=75,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-grid-market-data"
version = "0.1.0"
description = "Reusable Grid market-data owner: bounded public ingestion and read-only data API"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "websockets>=13,<16",
  "asyncpg>=0.30,<1",
  "psutil>=6,<9",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "psycopg[binary]==3.3.6",
]

[project.scripts]
grid-market-readonly = "grid.terminan_gateway:main"

[tool.setuptools]
packages = ["grid"]
include-package-data = false

[tool.setuptools.package-data]
grid = ["schema.sql"]
