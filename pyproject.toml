[build-system]
requires = ["setuptools>=75,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-grid-market-data"
version = "0.1.0"
description = "Reusable Grid market-data owner: bounded public ingestion and read-only data API"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "psycopg[binary]==3.3.6",
]

[project.scripts]
grid-market-readonly = "grid.terminan_gateway:main"

[tool.setuptools]
packages = ["grid"]
include-package-data = false

[tool.setuptools.package-data]
grid = ["schema.sql"]
